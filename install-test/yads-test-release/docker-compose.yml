version: '3.8'

services:
  # ==========================================================================
  # YADS CORE (always started)
  # ==========================================================================
  yads-api:
    image: registry.yads-security.com/yads/yads-api:${YADS_VERSION:-latest}
    container_name: yads-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD}@db:5432/yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
      - AUTH_MODE=${AUTH_MODE:-local}
      - SECRET_KEY=${SECRET_KEY}
      - OIDC_SERVER_URL=${OIDC_SERVER_URL:-http://keycloak:8080}
      - OIDC_PUBLIC_URL=${OIDC_PUBLIC_URL}
      - OIDC_REALM=${OIDC_REALM:-yads}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-yads}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
      - METRICS_AUTH_MODE=${METRICS_AUTH_MODE:-token}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - DISABLE_HTTPS_ONLY=${DISABLE_HTTPS_ONLY:-false}
    # When nginx is active: YADS_DIRECT_PORT (default 8000) for internal/debug access
    # When nginx is inactive: set YADS_DIRECT_PORT=API_PORT in .env for direct access
    ports:
      - "${YADS_DIRECT_PORT:-8000}:8000"
    volumes:
      - yads_logs:/app/logs
      - nuclei_templates:/root/nuclei-templates
    depends_on:
      - db
      - redis
    networks:
      - yads-net

  # --- nginx reverse proxy (used when HAS_NGINX=true, set by installer) ---
  nginx:
    image: nginx:alpine
    container_name: yads-nginx
    restart: always
    profiles: [nginx]
    ports:
      - "${API_PORT:-80}:${API_PORT:-80}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - yads-api
    networks:
      - yads-net

  yads-worker:
    image: registry.yads-security.com/yads/yads-worker:${YADS_VERSION:-latest}
    container_name: yads-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD}@db:5432/yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
      - DISABLE_HTTPS_ONLY=${DISABLE_HTTPS_ONLY:-false}
    volumes:
      - yads_logs:/app/logs
      - nuclei_templates:/root/nuclei-templates
    depends_on:
      - db
      - redis
    networks:
      - yads-net

  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    container_name: yads-db
    restart: always
    environment:
      - POSTGRES_USER=yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=yads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yads-net

  redis:
    image: valkey/valkey:8-alpine
    container_name: yads-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - yads-net

  # --- Optional: Keycloak ---
  keycloak-db:
    image: postgres:15-alpine
    profiles: [keycloak]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - yads-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    profiles: [keycloak]
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "${KC_PORT:-8080}:8080"
    depends_on:
      - keycloak-db
    networks:
      - yads-net

  # --- Optional: Monitoring ---
  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: [monitoring]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - yads-net

  grafana:
    image: grafana/grafana:10.4.0
    profiles: [monitoring]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - yads-net

volumes:
  postgres_data:
  yads_logs:
  nuclei_templates:
  redis_data:
  keycloak-db-data:
  prometheus-data:
  grafana-data:

networks:
  yads-net:
    driver: bridge
