
# YADS Homepage Local Development Configuration (Port 8082)
# Copy/Link this to /etc/nginx/sites-enabled/yads-homepage

server {
    listen 8082;
    server_name localhost;
    
    # Root points to the directory containing index.html, en/, de/, images/, css/
    root /home/mrmarco/Documents/gitlab/yads/yads-homepage;
    index index.html;

    # Serve files
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable caching for development
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    
    # Enable debugging headers
    add_header X-Debug-Root "Served from Localhost 8081";
}
