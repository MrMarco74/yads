# Docker Compose overlay for Prometheus + Grafana monitoring stack
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# This adds:
#   - Prometheus for metrics scraping
#   - Grafana for dashboards and alerting
#
# Ports:
#   - 9090: Prometheus Web UI
#   - 3000: Grafana Web UI (admin/admin by default)
#
# Prerequisites:
#   - Set METRICS_ENABLED=true on yads-api service
#   - Configure METRICS_TOKEN if using token authentication

services:
  # Override yads-api to enable metrics
  yads-api:
    environment:
      - METRICS_ENABLED=true
      - METRICS_AUTH_MODE=none  # Use 'token' with METRICS_TOKEN for production
      # - METRICS_TOKEN=your-secret-token-here
      - METRICS_INCLUDE_TENANT_LABELS=false
      - METRICS_POLL_INTERVAL=30

  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: yads-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - yads-api
    networks:
      - yads-net
    restart: unless-stopped

  # Grafana - Dashboards and visualization
  grafana:
    image: grafana/grafana:10.2.2
    container_name: yads-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      # Anonymous access for internal use (disable in production)
      # - GF_AUTH_ANONYMOUS_ENABLED=true
      # - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - yads-net
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
