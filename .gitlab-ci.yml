include:
  - project: "iac/ci-templates"
    file: "security-and-deploy.yml"

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_YADS: "$CI_REGISTRY_IMAGE/yads"
  # DOCKERFILE_PATH for linting
  DOCKERFILE_PATH: "Dockerfile"
  STACK_NAME: "yads"

stages:
  - lint
  - build
  - test
  - deploy

# --- LINT STAGE ---
docker-lint:
  extends: .lint-docker

yaml-lint:
  extends: .lint-yaml
  script:
    - yamllint .

# --- BUILD STAGE ---
build_images:
  stage: build
  image: docker:latest
  script:
    - docker system prune -af --volumes || true
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

    # Build & Push using Docker Compose
    # The .env file mechanism or direct env var substitution works here
    # We export variables needed for docker-compose.prod.yml substitution
    - export IMAGE_YADS=$IMAGE_YADS
    - export POSTGRES_PASSWORD=dummy_build_pass # Only needed for config valid check if referenced, but 'build' typically ignores values unless used in build args

    - docker compose -p yads-prod -f docker-compose.prod.yml -f docker-compose.build.yml build yads-api
    - docker compose -p yads-prod -f docker-compose.prod.yml -f docker-compose.build.yml push yads-api

    # SBOM (Disabled to save disk space on runner)
    - apk add --no-cache curl python3
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - syft "$IMAGE_YADS:latest" -o cyclonedx-json=sbom.json
    # Generate CBOM from SBOM
    - python3 scripts/generate_cbom.py
  artifacts:
    paths:
      - sbom.json
      - cbom.json
    expire_in: 1 week

# --- TEST STAGE ---
#secrets:
#   extends: .secret-detection

#checkov:
#   extends: .checkov-scan
#   variables:
#     SCAN_DIR: "."

# --- DEPLOY STAGE ---
deploy_to_portainer:
  extends: .deploy-portainer
  variables:
    COMPOSE_FILE_PATH: "docker-compose.prod.yml"
    PORTAINER_STACK_TYPE: "2" # 1=Swarm, 2=Standalone/Compose

# --- CLEANUP STAGE ---
cleanup:
  stage: deploy
  script:
    - docker system prune -af --volumes || true
  when: always
