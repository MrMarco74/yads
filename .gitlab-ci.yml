# Server-side backstop: blocks the pipeline if a known-sensitive term or
# private key lands on main. Primary sync to GitHub is the local pre-push
# hook (scripts/mirror_to_github.sh) — see scripts/install-git-hooks.sh.
stages:
  - security

secret_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners secret --exit-code 1 .
    - |
      # Excludes this file itself and mirror_to_github.sh: they legitimately
      # contain the pattern text as denylist config, not as a leak.
      DENYLIST='musterbank|redacted|familie-frischkorn\.de|highantdev\.de|fritz\.box'
      if grep -rEIl "$DENYLIST" --exclude-dir=.git --exclude=.gitlab-ci.yml --exclude=mirror_to_github.sh . ; then
        echo "Denylisted term found above." >&2
        exit 1
      fi
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
