# Server-side backstop: blocks the pipeline if a known-sensitive term or
# private key lands on main. Primary sync to GitHub is the local pre-push
# hook (scripts/mirror_to_github.sh) — see scripts/install-git-hooks.sh.
stages:
  - security

secret_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners secret --exit-code 1 .
    - |
      # The denylist of customer/private terms is NOT stored in this repo --
      # the pattern itself would be the leak. Provide it as the masked CI/CD
      # variable MIRROR_DENYLIST (Settings > CI/CD > Variables).
      DENYLIST="${MIRROR_DENYLIST:-}"
      if [ -z "$DENYLIST" ]; then
        echo "MIRROR_DENYLIST CI/CD variable is not set; failing closed." >&2
        exit 1
      fi
      if grep -rEIl "$DENYLIST" --exclude-dir=.git . ; then
        echo "Denylisted term found above." >&2
        exit 1
      fi
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
