
services:
  # --- Reverse Proxy (Optional, profile: nginx) ---
  nginx:
    image: nginx:alpine
    container_name: yads-proxy
    profiles: [nginx]
    restart: always
    ports:
      - "${API_PORT:-80}:${API_PORT:-80}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - yads-api
    networks:
      - yads-net

  # --- Backend Services ---
  yads-api:
    image: registry.yads-security.com/yads/yads-api:${YADS_VERSION:-latest}
    container_name: yads-api
    command: sh -c "/app/scripts/backup_db.sh && python /app/scripts/apply_license.py && python /app/scripts/maintenance/migrate_db.py && uvicorn yads.api.main:app --host 0.0.0.0 --port 8000"
    restart: always
    ports:
      # YADS_DIRECT_PORT=8000 when nginx is active (nginx handles external port).
      # YADS_DIRECT_PORT=API_PORT when no nginx (yads-api is directly reachable).
      - "${YADS_DIRECT_PORT:-8000}:8000"
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
      - SECRET_KEY=${SECRET_KEY}
      - LICENSE_KEY=${LICENSE_KEY}
      - DISABLE_HTTPS_ONLY=${DISABLE_HTTPS_ONLY:-false}
    networks:
      - yads-net

  yads-worker:
    image: registry.yads-security.com/yads/yads-worker:${YADS_VERSION:-latest}
    container_name: yads-worker
    command: python /app/scripts/start_worker.py
    restart: always
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
    depends_on:
      - db
      - redis
    networks:
      - yads-net

  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    container_name: yads-db
    restart: always
    environment:
      - POSTGRES_USER=yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=yads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yads-net

  redis:
    image: valkey/valkey:8-alpine
    container_name: yads-redis
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - yads-net

volumes:
  postgres_data:
  redis_data:

networks:
  yads-net:
    driver: bridge
