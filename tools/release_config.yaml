# YADS Release Automation Configuration Example
# Copy this file to ~/.yads/release.yaml and customize

# Upload settings
upload:
  method: ssh  # Primary method: 'ssh' or 'ftp'
  fallback: true  # Fallback to FTP if SSH fails

  ssh:
    host: yads-security.com
    user: deploy
    key_file: ~/.ssh/yads_deploy_key
    port: 22

  ftp:
    host: www209.your-server.de
    user: ftpuser
    password: ${YADS_FTP_PASSWORD}  # From environment variable
    port: 21
    tls: true  # Use FTPS (FTP over TLS) - recommended
    verify_ssl: true  # Verify server certificate
    # ca_cert: ~/.yads/server-ca.crt  # Not needed - DigiCert is system-trusted

  paths:
    releases: /en/releases
    homepage_en: /en
    homepage_de: /de

# Translation settings
translation:
  service: gemini  # 'gemini' or 'manual'
  api_key: ${GEMINI_API_KEY}  # From environment variable
  source_lang: EN
  target_lang: DE

# Git settings
git:
  auto_commit: true
  auto_tag: true
  push_after_release: false  # Manual push recommended

# Release settings
release:
  changelog_mode: interactive  # 'interactive' or 'editor'
  dry_run_default: true  # Always preview before execution

# Production deploy settings (Frischkorn-Prod)
deploy:
  portainer:
    url: https://prod.example.com:9443   # Portainer URL
    api_key: ${PORTAINER_API_KEY}                   # API key (Settings → API)
    stack_name: yads                                # Docker Swarm stack name
    verify_ssl: true                                # Set false for self-signed certs
    health_url: https://prod.example.com/api/health  # Optional health check

  ssh:
    host: prod.example.com
    user: root
    key_file: ~/.ssh/id_rsa
    port: 22

  migrations:
    enabled: true
    command: "docker exec yads-api python scripts/maintenance/migrate_db.py"
