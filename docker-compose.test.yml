# YADS Integration Test Stack
# Runs the full test suite inside the dev Docker image so all YADS
# dependencies are available, while using isolated tmpfs databases.
#
# Quickstart:
#   make test              — build + run full suite
#   make test-smoke        — smoke tests only
#   make test-coverage     — with HTML coverage report
#
# Manual:
#   docker compose -f docker-compose.test.yml run --rm test-runner
#   docker compose -f docker-compose.test.yml run --rm test-runner -m smoke

services:

  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yads_test
      POSTGRES_PASSWORD: yads_test
      POSTGRES_DB: yads_test
    tmpfs:
      - /var/lib/postgresql/data   # in-memory: fast teardown, no state
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yads_test"]
      interval: 3s
      timeout: 5s
      retries: 15

  test-redis:
    image: redis:7-alpine
    command: redis-server --loglevel warning --save ""   # no persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  test-runner:
    build:
      context: .
      target: dev
    working_dir: /app
    command: >
      sh -c "pip install -q pytest pytest-asyncio pytest-cov anyio &&
             python -m pytest $$PYTEST_ARGS"
    environment:
      DATABASE_URL: postgresql://yads_test:yads_test@test-db:5432/yads_test
      REDIS_URL: redis://test-redis:6379/0
      SECRET_KEY: test-secret-key-for-yads-testing-32chars!
      MFA_ENABLED: "false"
      AUTH_MODE: local
      METRICS_ENABLED: "false"
      DEBUG: "true"
      LOG_DIR: /tmp/yads-test-logs
      WORKER_MODE: standalone
      PYTEST_ARGS: ${PYTEST_ARGS:-}
    volumes:
      - .:/app
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
