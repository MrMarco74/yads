version: '3.8'

services:
  # --- Backend Services ---
  yads-api:
    image: yads-api:latest # Assumes loaded from tarball. Update registry URL if pulling involved.
    # Command chain: Backup -> Apply License -> Migrate DB -> Start App
    command: sh -c "/app/scripts/backup_db.sh && python /app/scripts/apply_license.py && python migrate_db.py && uvicorn yads.api.main:app --host 0.0.0.0 --port 8000"
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
      - SECRET_KEY=${SECRET_KEY}
      - LICENSE_KEY=${LICENSE_KEY}
    networks:
      - yads-net

  yads-worker:
    image: yads-worker:latest
    command: python /app/scripts/start_worker.py
    restart: always
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
    depends_on:
      - db
      - redis
    networks:
      - yads-net

  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=yads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yads-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - yads-net

volumes:
  postgres_data:
  redis_data:

networks:
  yads-net:
    driver: bridge
