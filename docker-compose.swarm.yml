# Docker Swarm Configuration for Distributed YADS Workers
#
# This configuration enables horizontal scaling of workers across multiple
# Docker Swarm nodes. The manager node runs the API and primary worker,
# while additional nodes run secondary workers.
#
# Deployment:
#   1. Initialize Swarm on manager: docker swarm init
#   2. Join worker nodes: docker swarm join --token <token> <manager-ip>:2377
#   3. Label worker nodes: docker node update --label-add yads-worker=true <node-name>
#   4. Deploy stack: docker stack deploy -c docker-compose.swarm.yml yads
#
# Optional Overlay Files:
#   With Keycloak:
#     docker stack deploy -c docker-compose.swarm.yml -c docker-compose.keycloak.swarm.yml yads
#   With Monitoring (Prometheus/Grafana/Loki/MinIO):
#     docker stack deploy -c docker-compose.swarm.yml -c docker-compose.monitoring.swarm.yml yads
#   With both:
#     docker stack deploy -c docker-compose.swarm.yml -c docker-compose.keycloak.swarm.yml -c docker-compose.monitoring.swarm.yml yads
#
# Environment Variables (set in .env or export before deploy):
#   WORKER_REGISTRATION_TOKEN: Pre-shared token for worker registration
#   POSTGRES_PASSWORD: Database password
#   YADS_IMAGE: Container image (default: yads:latest)
#   AUTH_MODE: "local" (default) or "oidc" — enable Keycloak SSO
#   OIDC_SERVER_URL: Internal container URL for Keycloak (token exchange)
#   OIDC_PUBLIC_URL: Browser-facing Keycloak URL (user redirects)
#   OIDC_REALM: Keycloak realm name (default: yads)
#   OIDC_CLIENT_ID: Keycloak client ID (default: yads)
#   OIDC_CLIENT_SECRET: Keycloak client secret
#   OIDC_REDIRECT_URI: OAuth2 callback URI
#   METRICS_ENABLED: Enable Prometheus /metrics endpoint (default: false)
#   METRICS_AUTH_MODE: Metrics auth mode (default: token)
#   METRICS_TOKEN: Bearer token for /metrics endpoint
#
# Scaling Workers:
#   docker service scale yads_yads-worker=5


services:
  # ==========================================================================
  # Core Services (Manager Node Only)
  # ==========================================================================

  yads-api:
    image: registry.yads-security.com/yads/yads-api:latest
    command: uvicorn yads.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD:-changeme_in_env}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/logs
      - MFA_ENABLED=${MFA_ENABLED:-true}
      - WORKER_MODE=primary
      - WORKER_REGISTRATION_TOKEN=${WORKER_REGISTRATION_TOKEN}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      # Authentication Mode: "local" (default) or "oidc" (Keycloak)
      - AUTH_MODE=${AUTH_MODE:-local}
      # OIDC/Keycloak — only relevant if AUTH_MODE=oidc
      # OIDC_SERVER_URL: Docker-internal URL (container-to-container token exchange)
      # OIDC_PUBLIC_URL: Browser-facing URL (user redirect to Keycloak login)
      - OIDC_SERVER_URL=${OIDC_SERVER_URL:-http://keycloak:8080}
      - OIDC_PUBLIC_URL=${OIDC_PUBLIC_URL:-http://localhost:8080}
      - OIDC_REALM=${OIDC_REALM:-yads}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-yads}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-changeme}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:8000/auth/oidc/callback}
      # Prometheus Metrics
      - METRICS_ENABLED=${METRICS_ENABLED:-false}
      - METRICS_AUTH_MODE=${METRICS_AUTH_MODE:-token}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    volumes:
      - logs:/app/logs
      - data:/app/data
    networks:
      yads-internal:
      yads-frontend:
      proxy-net:
        aliases:
          - yads-api
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == prod-node
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  yads-worker-primary:
    hostname: "yads-worker-primary"
    image: registry.yads-security.com/yads/yads-worker:latest
    command: python /app/scripts/start_worker.py
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD:-changeme_in_env}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
      - WORKER_MODE=primary
      - WORKER_NAME=yads-worker-primary
    volumes:
      - logs:/app/logs
      - data:/app/data
      - nuclei_templates:/root/nuclei-templates
    networks:
      - yads-internal
    dns:
      - 8.8.8.8
      - 8.8.4.4
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == prod-node
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ==========================================================================
  # Distributed Workers (Any Node with yads-worker=true label)
  # ==========================================================================

  yads-worker:
    image: registry.yads-security.com/yads/yads-worker:latest
    command: python /app/scripts/start_distributed_worker.py
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD:-changeme_in_env}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - MANAGER_URL=http://yads-api:8000
      - WORKER_REGISTRATION_TOKEN=${WORKER_REGISTRATION_TOKEN}
      - WORKER_MODE=secondary
      - WORKER_MAX_TASKS=${WORKER_MAX_TASKS:-4}
      - WORKER_MAX_NETWORK_MBPS=${WORKER_MAX_NETWORK_MBPS:-100}
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
    volumes:
      - data:/app/data
      - nuclei_templates:/root/nuclei-templates
    networks:
      - yads-internal
    dns:
      - 8.8.8.8
      - 8.8.4.4
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-0}
      placement:
        constraints:
          - node.hostname == prod-node
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 30s
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ==========================================================================
  # Support Portal (Manager Node Only)
  # ==========================================================================

  yads-support:
    image: registry.yads-security.com/yads-support:latest
    environment:
      - DEV_PRIVATE_KEY_FILE=/app/keys/dev_x25519_private.key
      - ADMIN_TOKEN=${SUPPORT_ADMIN_TOKEN}
      - ADMIN_IP_ALLOWLIST=${SUPPORT_ADMIN_IP_ALLOWLIST:-178.203.9.206,127.0.0.1,10.0.0.0/8}
      - ADMIN_PUBLIC_KEY=${SUPPORT_ADMIN_PUBLIC_KEY:-lvbmCRtPXZ5Z6IDym34PyM+T6b/vh20AlZEOlIx6NgY=}
      # License authority public key — same as YADS LICENSE_PUBLIC_KEY.
      # Enables self-service key registration from YADS instances.
      - LICENSE_AUTHORITY_PUBLIC_KEY=${LICENSE_AUTHORITY_PUBLIC_KEY:-}
      # Docker registry viewer
      - REGISTRY_URL=${REGISTRY_URL:-https://registry.yads-security.com}
      - REGISTRY_USER=${REGISTRY_USER:-}
      - REGISTRY_PASS=${REGISTRY_PASS:-}
    volumes:
      - support_keys:/app/keys:ro
      - support_data:/app/data
    networks:
      - proxy-net
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == prod-node
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ==========================================================================
  # Infrastructure (Manager Node Only)
  # ==========================================================================

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme_in_env}
      - POSTGRES_DB=yads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yads-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == prod-node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - yads-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == prod-node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==========================================================================
  # Automated Database Backup (Manager Node Only)
  # ==========================================================================

  yads-backup:
    image: registry.yads-security.com/yads/yads-backup:latest
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=yads
      - DB_USER=yads
      - BACKUP_BASE=/backups
      - APP_NAME=yads
      - DAILY_RETENTION_DAYS=14
      - CRON_SCHEDULE=0 3 * * *
      - CONFIG_PATH=/app/data/config.env
    volumes:
      - data:/app/data:ro
      - type: bind
        source: /mnt/backups/yads
        target: /backups
    networks:
      - yads-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == prod-node
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # ==========================================================================
  # Optional: Celery Beat Scheduler (Manager Node Only)
  # ==========================================================================

  yads-scheduler:
    image: registry.yads-security.com/yads/yads-worker:latest
    command: celery -A yads.worker beat --loglevel=INFO
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD:-changeme_in_env}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
    networks:
      - yads-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == prod-node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logs:
    driver: local
  data:
    driver: local
  nuclei_templates:
    driver: local
  support_keys:
    driver: local
  support_data:
    driver: local


networks:
  yads-internal:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"

  yads-frontend:
    driver: overlay
    attachable: true

  proxy-net:
    external: true
    name: proxy-net
