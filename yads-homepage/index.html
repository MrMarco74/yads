<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YADS - Select Language</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #334155;
        }
        h1 { margin-bottom: 2rem; color: #6366f1; }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            margin: 0.5rem;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { background: #4338ca; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid #475569; }
        .btn-outline:hover { background: #334155; }
    </style>
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>
    <div class="container">
        <h1>Select your Region / Region wählen</h1>
        <p style="margin-bottom: 2rem; color: #94a3b8;">Local Development Preview</p>
        
        <a href="/en/" class="btn">🇺🇸 English Concept</a>
        <a href="/de/" class="btn btn-outline">🇩🇪 German Concept</a>
    </div>
</body>
</html>
