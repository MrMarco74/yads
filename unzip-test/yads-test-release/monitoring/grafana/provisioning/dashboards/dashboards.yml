# Grafana dashboard provisioning
# This automatically loads dashboards from the dashboards directory

apiVersion: 1

providers:
  - name: 'YADS Dashboards'
    orgId: 1
    folder: 'YADS'
    folderUid: 'yads'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
