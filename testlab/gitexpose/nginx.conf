server {
    listen 80;
    server_name gitexpose.testlab.local;

    # Intentionally expose sensitive files — no restrictions

    location / {
        root /usr/share/nginx/html;
        autoindex on;
    }

    # Serve fake git repo at /.git/ (files stored as _git/ to allow git tracking)
    location /.git/ {
        alias /usr/share/nginx/html/_git/;
        autoindex on;
    }

    # Serve fake .env at /.env (stored as dot-env to avoid gitignore)
    location = /.env {
        alias /usr/share/nginx/html/dot-env;
        default_type text/plain;
    }
}
