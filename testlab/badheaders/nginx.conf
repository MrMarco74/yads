server {
    listen 80;
    server_name badheaders.testlab.local;

    # Intentionally missing all security headers:
    # No Content-Security-Policy
    # No X-Frame-Options
    # No X-Content-Type-Options
    # No Referrer-Policy
    # No Permissions-Policy
    # No Strict-Transport-Security

    # Bad cookies set via header
    add_header Set-Cookie "session=abc123; Path=/";
    add_header Set-Cookie "tracking=xyz; Path=/; domain=.testlab.local";
    # Missing: Secure, HttpOnly, SameSite

    # Wide-open CORS
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Credentials "true";

    location / {
        root /usr/share/nginx/html;
        index index.html;
        autoindex on;
    }
}
