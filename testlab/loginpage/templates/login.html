<!DOCTYPE html><html><body>
<h2>Login</h2>
{% if success %}<p style="color:green">Login successful!</p>{% endif %}
{% if error %}<p style="color:red">Invalid credentials</p>{% endif %}
<form method="post">
  <input name="username" placeholder="Username"><br>
  <input name="password" type="password" placeholder="Password"><br>
  <button>Login</button>
</form>
</body></html>
