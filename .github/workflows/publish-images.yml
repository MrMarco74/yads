name: Publish images to GHCR

# Builds the same 'api' and 'worker' Dockerfile targets used by
# docker-compose.prod.yml / docker-compose.server.yml in yads-infra, and
# publishes them to ghcr.io/mrmarco74/yads-{api,worker}. Opt-in alternative
# to the default build-from-source Quick Start -- see
# yads-infra/docker-compose.prebuilt.yml.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish images as (e.g. v1.20.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Determine version tag
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="$DISPATCH_TAG"
          else
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          # Only allow vX.Y.Z (matches this repo's tagging scheme) so a
          # manual dispatch input can't smuggle anything unexpected into an
          # image tag string.
          if ! [[ "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$RAW_TAG' -- expected vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            YADS_GIT_SHA=${{ github.sha }}
            YADS_BUILD_TIME=${{ steps.version.outputs.build_time }}
          tags: |
            ghcr.io/mrmarco74/yads-${{ matrix.target }}:${{ steps.version.outputs.tag }}
            ghcr.io/mrmarco74/yads-${{ matrix.target }}:latest

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes || true
