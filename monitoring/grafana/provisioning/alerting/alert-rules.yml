apiVersion: 1

# Alert Rules werden manuell in der Grafana UI angelegt.
# Grund: Grafana Unified Alerting erfordert vollständige relativeTimeRange-Felder
# die via YAML-Provisioning komplex zu pflegen sind.
#
# Zu konfigurierende Alerts (in Grafana UI unter Alerting > Alert Rules):
#
# 1. Worker Task Crash Rate High
#    Query: rate(yads_scan_errors_total[5m]) > 0.1
#    For: 5m | Severity: critical
#
# 2. Queue Paused Too Long
#    Query: yads_queue_paused == 1
#    For: 10m | Severity: warning
#
# 3. No Active Worker
#    Query: yads_active_scans == 0
#    For: 5m | Severity: critical
#
# 4. High Scan Failure Rate
#    Query: rate(yads_scan_errors_total[10m]) > 0.2
#    For: 10m | Severity: warning
#
# Notification Channel: YADS-Alerts (Teams + Email)
# Konfiguriert in: teams-email.yml
