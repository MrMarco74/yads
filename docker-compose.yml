services:
  # --- Backend Services ---
  yads-api:
    container_name: yads-app-yads-api-1
    build:
      context: .
      target: dev
    command: uvicorn yads.api.main:app --host 0.0.0.0 --port 8085 --reload
    ports:
      - "8085:8085"
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
      - MFA_ENABLED=false
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      # TLS/SSL Certificate Settings (optional)
      # - DISABLE_HTTPS_ONLY=false          # Emergency override to disable HTTPS-only mode
      # - CUSTOM_CA_CERT_PATH=/app/certs/ca-bundle.crt  # Custom CA for internal PKI
      # - CLIENT_CERT_PATH=/app/certs/client.crt       # Client certificate for mTLS
      # - CLIENT_KEY_PATH=/app/certs/client.key        # Client key for mTLS
    volumes:
      - ./logs:/app/logs
      - .:/app
      - nuclei_templates:/root/nuclei-templates
      # Uncomment to mount certificates:
      # - ./certs:/app/certs:ro
    depends_on:
      - db
      - redis
    networks:
      - yads-net
      - proxy-net

  yads-worker:
    build:
      context: .
      target: dev
    command: python /app/scripts/start_worker.py
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
      # TLS/SSL Certificate Settings (optional)
      # - DISABLE_HTTPS_ONLY=false          # Emergency override to disable HTTPS-only mode
      # - CUSTOM_CA_CERT_PATH=/app/certs/ca-bundle.crt  # Custom CA for internal PKI
      # - CLIENT_CERT_PATH=/app/certs/client.crt       # Client certificate for mTLS
      # - CLIENT_KEY_PATH=/app/certs/client.key        # Client key for mTLS
    volumes:
      - ./logs:/app/logs
      - .:/app
      - nuclei_templates:/root/nuclei-templates
      # Uncomment to mount certificates:
      # - ./certs:/app/certs:ro
    depends_on:
      - db
      - redis
    networks:
      - yads-net

  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yads_dev_local}
      - POSTGRES_DB=yads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yads-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - yads-net

  # --- Identity Provider ---
  keycloak-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - yads-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    depends_on:
      - keycloak-db
    networks:
      - yads-net

  # --- Observability Stack ---
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - yads-net

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.example.com:587"
      GF_SMTP_FROM_ADDRESS: "yads-alerts@example.com"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - yads-net

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - yads-net

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - yads-logs:/app/logs:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - yads-net

  # --- Cold Storage (5-year log retention) ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    networks:
      - yads-net

volumes:
  postgres_data:
  nuclei_templates:
  redis_data:
  keycloak-db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  minio-data:
  yads-logs:

networks:
  yads-net:
    driver: bridge
  proxy-net:
    external: true
