

services:
  # --- Backend Services ---
  yads-api:
    build:
      context: .
      target: dev
    command: uvicorn yads.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
      - MFA_ENABLED=false
      # TLS/SSL Certificate Settings (optional)
      # - DISABLE_HTTPS_ONLY=false          # Emergency override to disable HTTPS-only mode
      # - CUSTOM_CA_CERT_PATH=/app/certs/ca-bundle.crt  # Custom CA for internal PKI
      # - CLIENT_CERT_PATH=/app/certs/client.crt       # Client certificate for mTLS
      # - CLIENT_KEY_PATH=/app/certs/client.key        # Client key for mTLS
    volumes:
      - ./logs:/app/logs
      - .:/app
      - nuclei_templates:/root/nuclei-templates
      # Uncomment to mount certificates:
      # - ./certs:/app/certs:ro
    depends_on:
      - db
      - redis
    networks:
      - yads-net
    dns:
      - 8.8.8.8
      - 8.8.4.4


  yads-worker:
    build:
      context: .
      target: dev
    command: python /app/scripts/start_worker.py
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
      # TLS/SSL Certificate Settings (optional)
      # - DISABLE_HTTPS_ONLY=false          # Emergency override to disable HTTPS-only mode
      # - CUSTOM_CA_CERT_PATH=/app/certs/ca-bundle.crt  # Custom CA for internal PKI
      # - CLIENT_CERT_PATH=/app/certs/client.crt       # Client certificate for mTLS
      # - CLIENT_KEY_PATH=/app/certs/client.key        # Client key for mTLS
    volumes:
      - ./logs:/app/logs
      - .:/app
      - nuclei_templates:/root/nuclei-templates
      # Uncomment to mount certificates:
      # - ./certs:/app/certs:ro
    depends_on:
      - db
      - redis
    networks:
      - yads-net
    dns:
      - 8.8.8.8
      - 8.8.4.4




  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=yads
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=yads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yads-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - yads-net

volumes:
  postgres_data:
  nuclei_templates:
  redis_data:

networks:
  yads-net:
    driver: bridge

