services:
  # --- Reverse Proxy (Optional, profile: nginx) ---
  nginx:
    image: nginx:alpine
    container_name: yads-proxy
    profiles: [nginx]
    restart: always
    ports:
      - "${API_PORT:-80}:${API_PORT:-80}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - yads-api
    networks:
      - yads-net

  # --- Backend Services ---
  yads-api:
    image: registry.yads-security.com/yads/yads-api:${YADS_VERSION:-latest}
    container_name: yads-api
    command: sh -c "/app/scripts/backup_db.sh && python /app/scripts/apply_license.py && python /app/scripts/maintenance/migrate_db.py && uvicorn yads.api.main:app --host 0.0.0.0 --port 8000"
    restart: always
    volumes:
      - ./yads:/app/yads
      - ./scripts:/app/scripts
      - ./yads_module_signing.key:/run/secrets/yads_module_signing.key:ro
    ports:
      # YADS_DIRECT_PORT=8000 when nginx is active (nginx handles external port).
      # YADS_DIRECT_PORT=API_PORT when no nginx (yads-api is directly reachable).
      - "${YADS_DIRECT_PORT:-8000}:8000"
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-yads}:${POSTGRES_PASSWORD}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - BROKER_URL=amqp://yads:yads@rabbitmq:5672//
      - LOG_DIR=/app/logs
      - SECRET_KEY=${SECRET_KEY}
      - LICENSE_KEY=${LICENSE_KEY}
      - YADS_ADMIN_USER=${YADS_ADMIN_USER}
      - YADS_ADMIN_PASS=${YADS_ADMIN_PASS}
      - SETUP_COMPLETE=${SETUP_COMPLETE:-true}
      - DISABLE_HTTPS_ONLY=${DISABLE_HTTPS_ONLY:-false}
      - MODULE_SIGNING_PRIVATE_KEY_PATH=/run/secrets/yads_module_signing.key
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - yads-net

  yads-worker:
    image: registry.yads-security.com/yads/yads-worker:${YADS_VERSION:-latest}
    container_name: yads-worker
    command: python /app/scripts/start_worker.py
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-yads}:${POSTGRES_PASSWORD}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - BROKER_URL=amqp://yads:yads@rabbitmq:5672//
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
    volumes:
      - ./yads:/app/yads
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      yads-api:
        condition: service_healthy
    networks:
      - yads-net

  # --- Message Broker ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: yads-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=yads
      - RABBITMQ_DEFAULT_PASS=yads
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # Management UI (optional, bind only locally)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - yads-net

  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    container_name: yads-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yads}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=yads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yads} -d yads"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - yads-net

  redis:
    image: valkey/valkey:8-alpine
    container_name: yads-redis
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - yads-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  yads-net:
    driver: bridge
