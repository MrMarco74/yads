<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}YADS Support Portal{% endblock %}</title>
  <style>
    /* ------------------------------------------------------------------ */
    /* Design tokens                                                        */
    /* ------------------------------------------------------------------ */
    :root {
      --bg:           #0f172a;
      --surface:      #1e293b;
      --surface-2:    #273449;
      --border:       #334155;
      --text:         #f1f5f9;
      --text-muted:   #94a3b8;
      --accent:       #6366f1;
      --accent-hover: #818cf8;

      --status-new:      #ef4444;
      --status-new-bg:   #450a0a;
      --status-open:     #f59e0b;
      --status-open-bg:  #451a03;
      --status-resolved: #22c55e;
      --status-res-bg:   #052e16;
    }

    /* ------------------------------------------------------------------ */
    /* Reset / base                                                         */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    /* ------------------------------------------------------------------ */
    /* Navbar                                                               */
    /* ------------------------------------------------------------------ */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-shrink: 0;
    }
    .navbar__logo {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .navbar__logo span.pill {
      font-size: 0.65rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 1px 7px;
      letter-spacing: 0.05em;
    }
    .navbar__nav {
      display: flex;
      gap: 0.25rem;
      margin-left: auto;
    }
    .navbar__nav a {
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .navbar__nav a:hover,
    .navbar__nav a.active { background: var(--surface-2); color: var(--text); text-decoration: none; }

    /* ------------------------------------------------------------------ */
    /* Main content                                                         */
    /* ------------------------------------------------------------------ */
    .content {
      flex: 1;
      padding: 2rem 1.5rem;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    /* ------------------------------------------------------------------ */
    /* Cards                                                                */
    /* ------------------------------------------------------------------ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    /* ------------------------------------------------------------------ */
    /* Tables                                                               */
    /* ------------------------------------------------------------------ */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    thead tr { border-bottom: 1px solid var(--border); }
    th {
      text-align: left;
      padding: 0.6rem 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    td {
      padding: 0.65rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }

    /* ------------------------------------------------------------------ */
    /* Status badges                                                        */
    /* ------------------------------------------------------------------ */
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge--new      { background: var(--status-new-bg);   color: var(--status-new); }
    .badge--open     { background: var(--status-open-bg);  color: var(--status-open); }
    .badge--resolved { background: var(--status-res-bg);   color: var(--status-resolved); }

    /* ------------------------------------------------------------------ */
    /* KPI cards                                                            */
    /* ------------------------------------------------------------------ */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }
    .kpi-card__label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 0.4rem; }
    .kpi-card__value { font-size: 2.25rem; font-weight: 700; line-height: 1; }
    .kpi-card--new   .kpi-card__value { color: var(--status-new); }
    .kpi-card--open  .kpi-card__value { color: var(--status-open); }
    .kpi-card--total .kpi-card__value { color: var(--text); }

    /* ------------------------------------------------------------------ */
    /* Section heading                                                      */
    /* ------------------------------------------------------------------ */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-header h2 { font-size: 1rem; font-weight: 600; }

    /* ------------------------------------------------------------------ */
    /* Forms / buttons                                                      */
    /* ------------------------------------------------------------------ */
    select, input[type="text"] {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.4rem 0.65rem;
      font-size: 0.875rem;
      outline: none;
    }
    select:focus, input[type="text"]:focus { border-color: var(--accent); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn--primary { background: var(--accent); color: #fff; }
    .btn--primary:hover { background: var(--accent-hover); }
    .btn--secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn--secondary:hover { background: var(--border); }
    .btn--copy { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
    .btn--copy:hover { color: var(--text); }

    /* ------------------------------------------------------------------ */
    /* Filter form                                                          */
    /* ------------------------------------------------------------------ */
    .filter-form { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1.25rem; }

    /* ------------------------------------------------------------------ */
    /* Detail grid                                                          */
    /* ------------------------------------------------------------------ */
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .detail-item__label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 0.2rem; }
    .detail-item__value { font-size: 0.9rem; word-break: break-all; }

    /* ------------------------------------------------------------------ */
    /* Pre / code blocks                                                    */
    /* ------------------------------------------------------------------ */
    pre {
      background: #0a0f1d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      font-size: 0.8rem;
      line-height: 1.6;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ------------------------------------------------------------------ */
    /* Misc                                                                 */
    /* ------------------------------------------------------------------ */
    .text-muted { color: var(--text-muted); }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .mb-3 { margin-bottom: 1.5rem; }
    .mt-2 { margin-top: 1rem; }
    .gap-1 { gap: 0.5rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .empty { text-align: center; padding: 2.5rem; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar__logo">
      YADS Support Portal <span class="pill">INTERNAL</span>
    </div>
    <div class="navbar__nav">
      <a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Dashboard</a>
      <a href="/reports" {% if request.url.path.startswith("/reports") %}class="active"{% endif %}>Reports</a>
      <a href="/contacts" {% if request.url.path.startswith("/contacts") %}class="active"{% endif %}>Contacts</a>
      <a href="/installations" {% if request.url.path.startswith("/installations") and not request.url.path.startswith("/activations") %}class="active"{% endif %}>Installations</a>
      <a href="/activations" {% if request.url.path.startswith("/activations") %}class="active"{% endif %}>Aktivierungen</a>
      <a href="/registry/" {% if request.url.path.startswith("/registry") %}class="active"{% endif %}>Registry</a>
    </div>
  </nav>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
