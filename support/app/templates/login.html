<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YADS Support Portal – Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo .pill {
      font-size: 0.65rem;
      font-weight: 600;
      background: #6366f1;
      color: #fff;
      border-radius: 999px;
      padding: 1px 7px;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }
    input[type="password"] {
      width: 100%;
      background: #273449;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f1f5f9;
      padding: 0.55rem 0.75rem;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 1.25rem;
    }
    input[type="password"]:focus { border-color: #6366f1; }
    button {
      width: 100%;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #818cf8; }
    .error {
      background: #450a0a;
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">YADS Support Portal <span class="pill">INTERNAL</span></div>
    <div class="subtitle">Anmeldung erforderlich</div>

    {% if error %}
    <div class="error">Falsches Passwort.</div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}" />
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password" />
      <button type="submit">Anmelden</button>
    </form>
  </div>
</body>
</html>
