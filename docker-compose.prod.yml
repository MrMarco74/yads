version: '3.8'

services:
  # --- Backend Services ---
  yads-api:
    image: gitlab.example.internal:5050/apps/yads/yads:latest

    command: sh -c "/app/scripts/backup_db.sh && python migrate_db.py && uvicorn yads.api.main:app --host 0.0.0.0 --port 8000"
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD:-yads_secret_password}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
      # Secrets should be passed via env vars in Portainer/CI
      - SECRET_KEY=${SECRET_KEY}
      - API_KEY=${API_KEY}
    networks:
      yads-net:
      proxy-net:
        aliases:
          - yads

  yads-worker:
    image: gitlab.example.internal:5050/apps/yads/yads:latest

    command: python /app/scripts/start_worker.py
    restart: always
    environment:
      - DATABASE_URL=postgresql://yads:${POSTGRES_PASSWORD:-yads_secret_password}@db:5432/yads
      - REDIS_URL=redis://redis:6379/0
      - CHROME_BIN=/usr/bin/google-chrome
      - LOG_DIR=/app/logs
    depends_on:
      - db
      - redis
    networks:
      - yads-net

  # --- Infrastructure ---
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=yads
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-yads_secret_password}
      - POSTGRES_DB=yads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yads-net

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - yads-net

volumes:
  postgres_data:

networks:
  yads-net:
    driver: bridge
  proxy-net:
    external: true
    name: proxy-net
