{% extends "base.html" %}

{% block content %}
<div class="flex flex-col" style="height: calc(100vh - 8rem);">
    <!-- Header & Controls Wrapper -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-4 shrink-0">
        <div>
            <h1 class="text-3xl font-bold text-white">Target Spiderweb</h1>
            <p class="text-gray-400 text-sm">Visualize connections between domains, IPs, and infrastructure.</p>
        </div>
        
        <!-- Controls -->
        <div class="flex items-center gap-4 bg-gray-800/50 border border-gray-700/50 rounded-xl p-2 shadow-lg">
            <div class="w-64">
                <select id="target-select" class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                    <option value="" disabled selected>Choose a domain...</option>
                    {% for t in targets %}
                        <option value="{{ t.id }}">{{ t.domain }}</option>
                    {% endfor %}
                </select>
            </div>
            <button id="render-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg shadow-lg shadow-indigo-500/20 transition-all flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Render
            </button>
        </div>
    </div>

    <!-- Graph Container -->
    <div id="graph-container" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl shadow-inner relative overflow-hidden w-full">
        <div id="loading-overlay" class="absolute inset-0 bg-gray-900/80 flex items-center justify-center z-10 hidden">
            <div class="flex flex-col items-center">
                <svg class="animate-spin h-10 w-10 text-indigo-500 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-indigo-300 font-mono text-sm">Analyzing connections...</span>
            </div>
        </div>
        <div id="mynetwork" class="w-full h-full"></div>
        
        <!-- Empty State Prompt -->
        <div id="empty-prompt" class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="text-center">
                 <svg class="w-16 h-16 text-gray-700 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                 <p class="text-gray-600 text-lg">Select a target to visualize the network</p>
            </div>
        </div>
    </div>
    
    <!-- Legend -->
    <div class="mt-2 flex flex-wrap gap-4 justify-center text-xs text-gray-500 shrink-0">
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#ff5e5e] shadow-[0_0_8px_rgba(255,94,94,0.5)]"></span> Target</div>
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#ff9f43]"></span> Subdomain</div>
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#2e86de]"></span> IP Address</div>
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-[#1dd1a1]"></span> SSL Issuer</div>
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 border border-[#a55eea] bg-[#a55eea]/20"></span> ASN/Org</div>
    </div>
</div>

<!-- Vis.js -->
<script type="text/javascript" src="/static/js/vis-network.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const select = document.getElementById('target-select');
        const btn = document.getElementById('render-btn');
        const loader = document.getElementById('loading-overlay');
        const empty = document.getElementById('empty-prompt');
        const container = document.getElementById('mynetwork');
        
        let network = null;

        btn.addEventListener('click', async () => {
             const targetId = select.value;
             if (!targetId) return;

             // UI Updates
             loader.classList.remove('hidden');
             empty.classList.add('hidden');
             if (network) network.destroy();

             try {
                 const response = await fetch(`/api/graph/${targetId}`);
                 const data = await response.json();

                 if (data.error) {
                     alert("Error fetching graph data: " + data.error);
                     loader.classList.add('hidden');
                     return;
                 }

                 // Create vis.js data
                 const nodes = new vis.DataSet(data.nodes);
                 const edges = new vis.DataSet(data.edges);

                 const options = {
                    nodes: {
                        shape: 'dot',
                        size: 20,
                        font: {
                            size: 14,
                            color: '#ffffff'
                        },
                        borderWidth: 2,
                        shadow: true
                    },
                    edges: {
                        width: 2,
                        color: { color: '#57606f', highlight: '#a29bfe' },
                        smooth: {
                             type: 'continuous' 
                        }
                    },
                    physics: {
                        stabilization: false,
                        barnesHut: {
                            gravitationalConstant: -8000,
                            springConstant: 0.04,
                            springLength: 95
                        }
                    },
                    interaction: {
                        hover: true,
                        tooltipDelay: 200,
                        zoomView: true
                    }
                 };

                 network = new vis.Network(container, { nodes, edges }, options);
                 
                 // Handle Click
                 network.on("click", function (params) {
                     params.event = "[original event]";
                     // potentially show details panel?
                 });

             } catch (e) {
                 console.error(e);
                 alert("Failed to render graph.");
             } finally {
                 loader.classList.add('hidden');
             }
        });
    });
</script>
{% endblock %}
