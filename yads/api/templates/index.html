{% extends "base.html" %}

{% block content %}
<div class="space-y-8">
    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gray-800/50 border border-indigo-500/20 rounded-xl p-6 shadow-lg backdrop-blur-sm">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-indigo-500/10 rounded-lg text-indigo-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div>
                    <h3 class="text-sm font-medium text-gray-400">Active Targets</h3>
                    <p class="text-2xl font-bold text-white">{{ stats.active_targets }}</p>
                </div>
            </div>
        </div>
        
        <div class="bg-gray-800/50 border border-purple-500/20 rounded-xl p-6 shadow-lg backdrop-blur-sm">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-purple-500/10 rounded-lg text-purple-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <div>
                    <h3 class="text-sm font-medium text-gray-400">Total Scans</h3>
                    <p class="text-2xl font-bold text-white">{{ stats.total_scans }}</p>
                </div>
            </div>
        </div>

        <div class="bg-gray-800/50 border border-emerald-500/20 rounded-xl p-6 shadow-lg backdrop-blur-sm">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-emerald-500/10 rounded-lg text-emerald-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h3 class="text-sm font-medium text-gray-400">System Status</h3>
                    <p class="text-2xl font-bold text-white">Online</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left: Target List -->
        <div class="lg:col-span-2 space-y-6">
            <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                Monitored Domains
            </h2>

            <!-- Targets Container -->
            <!-- Wrapped in a div that HTMX can target if needed, but inner content is valid -->
            {% include "_target_list.html" %}
            <!-- Removed inline grid logic -->

        </div>

        <!-- Right: Add Target -->
        <div>
            <div class="bg-gray-800/50 border border-gray-700 rounded-xl p-6 sticky top-24">
                <h3 class="text-lg font-semibold text-white mb-4">Add New Target</h3>
                <form action="/targets/add" method="POST">
                    <div class="space-y-4">
                        <div>
                            <label for="domain" class="block text-sm font-medium text-gray-400 mb-1">Domain Name</label>
                            <input type="text" name="domain" id="domain" placeholder="example.com" required
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg shadow-lg shadow-indigo-500/20 transition-all transform hover:scale-[1.02]">
                            Start Monitoring
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
