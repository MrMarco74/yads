{% extends "base.html" %}

{% block content %}
<div class="space-y-8">
    <!-- Stats Row -->
    {% include "_dashboard_stats.html" %}

    <!-- Active Scans Row -->
    {% include "_active_scans.html" %}

    <!-- Modal Container (Placeholder) -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none empty:hidden">
        <!-- Content injected here will need pointer-events-auto -->
    </div>

    <!-- JavaScript to handle modal background click to close -->
    <script>
        document.getElementById('modal-container').addEventListener('click', function(e) {
            if (e.target === this) {
                this.innerHTML = '';
            }
        });
        // Make sure injected content enables pointer events
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                 if (mutation.addedNodes.length) {
                     document.getElementById('modal-container').classList.remove('pointer-events-none');
                     document.getElementById('modal-container').classList.add('pointer-events-auto', 'bg-black/50', 'backdrop-blur-sm');
                 } else {
                     document.getElementById('modal-container').classList.add('pointer-events-none');
                     document.getElementById('modal-container').classList.remove('pointer-events-auto', 'bg-black/50', 'backdrop-blur-sm');
                 }
            });
        });
        observer.observe(document.getElementById('modal-container'), { childList: true });
    </script>

    <!-- Main Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left: Target List -->
        <div class="lg:col-span-2 space-y-6">
            <h2 class="text-xl font-semibold text-white flex items-center gap-2">
                <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                Monitored Domains
            </h2>

            <!-- Targets Container -->
            <!-- Wrapped in a div that HTMX can target if needed, but inner content is valid -->
            {% include "_target_list.html" %}
            <!-- Removed inline grid logic -->

        </div>

        <!-- Right: Add Target -->
        <div>
            <!-- Right: Add Target -->
        <div>
            {% if user and user.role != 'viewer' %}
            <div class="bg-gray-800/50 border border-gray-700 rounded-xl p-6 sticky top-24">
                <h3 class="text-lg font-semibold text-white mb-4">Add New Target</h3>
                <form action="/targets/add" method="POST">
                    <div class="space-y-4">
                        <div>
                            <label for="domain" class="block text-sm font-medium text-gray-400 mb-1">Domain Name</label>
                            <input type="text" name="domain" id="domain" placeholder="example.com" required
                                class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg shadow-lg shadow-indigo-500/20 transition-all transform hover:scale-[1.02]">
                            Start Monitoring
                        </button>
                    </div>
                </form>
            </div>
            {% endif %}
        </div>

    </div>
</div>
{% endblock %}
