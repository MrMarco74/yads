{% extends "base.html" %}

{% block content %}
<div class="h-[calc(100vh-12rem)] flex flex-col lg:flex-row gap-4">
    
    <!-- Sidebar: Asset List -->
    <div class="w-full lg:w-96 bg-slate-900 border border-slate-800 rounded-xl flex flex-col overflow-hidden shadow-xl">
        <div class="p-4 border-b border-slate-800 bg-slate-950 flex items-center justify-between">
            <div>
                <h3 class="text-sm font-bold text-white uppercase tracking-wider">Discovered Assets</h3>
                <p class="text-[10px] text-slate-500 mt-0.5">{{ target.domain }} Infrastructure</p>
            </div>
            <a href="/targets/{{ target.id }}" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                Details
            </a>
        </div>
        
        <div id="asset-list" class="flex-grow overflow-y-auto divide-y divide-slate-800/50 p-2">
            <div class="flex items-center justify-center h-32 text-slate-600 italic text-sm">
                Loading assets...
            </div>
        </div>
        
        <div class="p-3 bg-slate-950/50 border-t border-slate-800 text-[10px] text-slate-500 flex justify-between">
            <span id="point-count">0 points found</span>
            <span class="text-cyan-500 font-bold uppercase">Geospatial Intelligence</span>
        </div>
    </div>

    <!-- Map Area -->
    <div class="flex-grow relative bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
        <div id="osint-map" class="absolute inset-0 z-0"></div>
        
        <!-- Legend Overlay -->
        <div class="absolute bottom-6 right-6 z-10 bg-slate-900/90 backdrop-blur-md border border-slate-700 p-3 rounded-lg text-xs shadow-2xl space-y-2">
            <div class="font-bold text-slate-400 mb-2 uppercase tracking-tight">Legend</div>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]"></span>
                <span class="text-slate-300">Critical Threat</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-orange-500"></span>
                <span class="text-slate-300">Suspicious</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-cyan-500"></span>
                <span class="text-slate-300">Neutral Discovery</span>
            </div>
        </div>
        
        <!-- Controls Overlay -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 z-10 flex gap-2">
            <button onclick="resetMapView()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold py-1.5 px-3 rounded shadow-lg transition-all flex items-center gap-2">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                RESET VIEW
            </button>
        </div>
    </div>
</div>

<style>
/* Custom Marker Styles */
.leaflet-container {
    background: #0f172a !important;
}
.osint-marker {
    display: flex;
    align-items: center;
    justify-center;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
    transition: transform 0.2s;
}
.osint-marker:hover {
    transform: scale(1.5);
    z-index: 1000 !important;
}
.marker-high { background-color: #ef4444; box-shadow: 0 0 15px rgba(239,68,68,0.8); }
.marker-med { background-color: #f97316; }
.marker-low { background-color: #06b6d4; }

/* Popup Styles */
.leaflet-popup-content-wrapper {
    background: #1e293b !important;
    color: #f1f5f9 !important;
    border: 1px solid #334155 !important;
    border-radius: 12px !important;
}
.leaflet-popup-tip {
    background: #1e293b !important;
}
</style>

<script>
    var map;
    var markers = [];
    var geoJsonLayer;

    document.addEventListener('DOMContentLoaded', function() {
        initMap();
        loadGeoData();
    });

    function initMap() {
        map = L.map('osint-map', {
            center: [20, 0],
            zoom: 2,
            attributionControl: false,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);
    }

    async function loadGeoData() {
        const url = "{{ '/osint/target/' + target.id|string + '/geo-json' if target else '/osint/global-geo-json' }}";
        const response = await fetch(url);
        if (!response.ok) return;

        const data = await response.json();
        renderGeoData(data);
    }

    function renderGeoData(geoJson) {
        const assetList = document.getElementById('asset-list');
        const countLabel = document.getElementById('point-count');
        assetList.innerHTML = '';
        
        if (!geoJson.features || geoJson.features.length === 0) {
            assetList.innerHTML = '<div class="p-8 text-center text-slate-600">No geographical data found for discovered infrastructure.</div>';
            return;
        }

        countLabel.innerText = `${geoJson.features.length} points discovered`;

        geoJsonLayer = L.geoJSON(geoJson, {
            pointToLayer: function(feature, latlng) {
                const sev = feature.properties.severity || 'low';
                const cls = sev === 'critical' ? 'marker-high' : sev === 'high' ? 'marker-high' : sev === 'medium' ? 'marker-med' : 'marker-low';
                
                const icon = L.divIcon({
                    className: `osint-marker ${cls}`,
                    iconSize: [12, 12],
                    iconAnchor: [6, 6]
                });

                const marker = L.marker(latlng, { icon: icon });
                
                marker.bindPopup(`
                    <div class="px-1 py-2 min-w-[150px]">
                        <div class="flex items-center justify-between mb-2">
                             <div class="text-[9px] text-slate-500 uppercase font-bold tracking-wider">${feature.properties.data_type.replace('_',' ')}</div>
                         {% if not target %}
                         <div class="text-[8px] bg-indigo-500/20 text-indigo-400 px-1 rounded font-bold">${feature.properties.domain}</div>
                         {% endif %}
                        </div>
                        <div class="text-sm font-bold text-white mb-1">${feature.properties.subdomain}</div>
                        <div class="text-xs text-indigo-400 font-mono mb-2">${feature.properties.ip}</div>
                        <div class="flex items-center gap-2 text-[10px] text-slate-400 border-t border-slate-700 pt-2">
                            <span>📍 ${feature.properties.city}, ${feature.properties.country}</span>
                        </div>
                        {% if not target %}
                        <div class="mt-2 pt-2 border-t border-slate-800">
                             <a href="/targets/${feature.properties.target_id}" class="text-[9px] text-cyan-500 hover:text-cyan-400 font-bold uppercase tracking-tighter">View Target Details →</a>
                        </div>
                        {% endif %}
                    </div>
                `, { closeButton: false });

                return marker;
            }
        }).addTo(map);

        // Sidebar List
        geoJson.features.forEach((feature, idx) => {
            const sev = feature.properties.severity || 'low';
            const colorCls = sev === 'critical' || sev === 'high' ? 'bg-red-500' : sev === 'medium' ? 'bg-orange-500' : 'bg-cyan-500';
            
            const card = document.createElement('div');
            card.className = "p-3 hover:bg-slate-800/80 cursor-pointer transition-all border-l-2 border-transparent hover:border-indigo-500 group";
            card.innerHTML = `
                <div class="flex items-start justify-between">
                    <div class="flex-grow">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="w-2 h-2 rounded-full ${colorCls}"></span>
                            <span class="text-xs font-bold text-slate-200 truncate max-w-[160px]">${feature.properties.subdomain}</span>
                        </div>
                        <div class="flex items-center gap-2">
                             <div class="text-[10px] font-mono text-slate-500">${feature.properties.ip}</div>
                             {% if not target %}
                             <div class="text-[9px] text-indigo-500/70 font-bold truncate max-w-[80px]">${feature.properties.domain}</div>
                             {% endif %}
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                         <div class="text-[9px] text-slate-600 uppercase font-bold">${feature.properties.city}</div>
                         <div class="text-[8px] text-slate-700 uppercase">${feature.properties.country}</div>
                    </div>
                </div>
            `;

            card.onclick = () => {
                const coords = [feature.geometry.coordinates[1], feature.geometry.coordinates[0]];
                map.flyTo(coords, 12);
                
                // Find corresponding layer to open popup
                geoJsonLayer.eachLayer(layer => {
                    if (layer.feature === feature) {
                        layer.openPopup();
                    }
                });
            };

            assetList.appendChild(card);
        });

        // Fit bounds
        if (geoJson.features.length > 0) {
            map.fitBounds(geoJsonLayer.getBounds(), { padding: [50, 50] });
        }
    }

    function resetMapView() {
        if (geoJsonLayer) {
            map.fitBounds(geoJsonLayer.getBounds(), { padding: [50, 50] });
        } else {
            map.setView([20, 0], 2);
        }
    }
</script>
{% endblock %}
