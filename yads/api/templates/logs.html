{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto h-[calc(100vh-140px)] flex flex-col">
    <div class="flex items-center justify-between mb-4">
        <div>
            <h1 class="text-2xl font-bold text-white">System Logs</h1>
            <p class="text-sm text-gray-400">Real-time stream from API and Worker nodes.</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
            </span>
            <span class="text-sm text-gray-400">Live</span>
        </div>
    </div>

    <!-- Console Window -->
    <div class="flex-1 bg-black rounded-xl border border-gray-800 shadow-2xl overflow-hidden flex flex-col font-mono text-sm">
        <!-- Toolbar -->
        <div class="bg-gray-900 border-b border-gray-800 px-4 py-2 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/50"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/50"></div>
                </div>
                <!-- Log File Selector -->
                <div class="relative">
                    <select id="log-file-select" onchange="changeLogFile()" class="bg-gray-800 border border-gray-700 text-gray-300 text-xs rounded px-2 py-1 outline-none focus:border-indigo-500">
                        {% for log_file in log_files %}
                        <option value="{{ log_file }}" {% if log_file == current_log %}selected{% endif %}>{{ log_file }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Pause Button -->
                <button id="pause-btn" onclick="togglePause()" class="px-2 py-0.5 rounded text-xs font-mono border border-gray-700 bg-gray-800 hover:bg-gray-700 text-gray-400 transition-colors flex items-center gap-2">
                    <span id="pause-icon" class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span id="pause-text">Live</span>
                </button>
            </div>
            <span class="text-xs text-gray-500">root@yads-cluster:~/logs/<span id="current-log-label">{{ current_log }}</span></span>
        </div>

        <!-- Log Output -->
        <div id="log-container" class="flex-1 overflow-y-auto p-4 space-y-1 text-gray-300 log-container">
            <div class="text-gray-500 italic">Connecting to log stream...</div>
        </div>
    </div>
</div>

<script>
    const logContainer = document.getElementById('log-container');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseIcon = document.getElementById('pause-icon');
    const pauseText = document.getElementById('pause-text');
    const logSelect = document.getElementById('log-file-select');
    const currentLogLabel = document.getElementById('current-log-label');
    
    let autoScroll = true;
    let isPaused = false;
    let currentLogFile = "{{ current_log }}";

    function changeLogFile() {
        currentLogFile = logSelect.value;
        currentLogLabel.innerText = currentLogFile;
        // Reset container to indicate loading
        logContainer.innerHTML = '<div class="text-gray-500 italic">Switching log stream...</div>';
        fetchLogs();
    }

    function togglePause() {
        isPaused = !isPaused;
        if (isPaused) {
            pauseText.innerText = "Paused";
            pauseIcon.classList.remove('bg-green-500', 'animate-pulse');
            pauseIcon.classList.add('bg-yellow-500');
            pauseBtn.classList.add('border-yellow-500/50', 'text-yellow-500');
        } else {
            pauseText.innerText = "Live";
            pauseIcon.classList.remove('bg-yellow-500');
            pauseIcon.classList.add('bg-green-500', 'animate-pulse');
            pauseBtn.classList.remove('border-yellow-500/50', 'text-yellow-500');
            fetchLogs(); // Fetch immediately
        }
    }

    // Detect if user scrolls up to disable auto-scroll
    logContainer.addEventListener('scroll', () => {
        const { scrollTop, scrollHeight, clientHeight } = logContainer;
        if (scrollTop + clientHeight < scrollHeight - 20) {
            autoScroll = false;
        } else {
            autoScroll = true;
        }
    });

    async function fetchLogs() {
        if (isPaused) return;

        try {
            const res = await fetch(`/api/logs/stream?file=${currentLogFile}`);
            const data = await res.json();
            
            // Clear current logs and render new ones (basic approach)
            // Ideally we would append only new lines, but replacing is easier for "tail" logic
            logContainer.innerHTML = data.logs.map(line => {
                // Formatting for log levels
                let className = "text-gray-300";
                if (line.includes("ERROR")) className = "text-red-400 font-bold";
                else if (line.includes("WARNING")) className = "text-yellow-400";
                else if (line.includes("INFO")) className = "text-blue-300";
                else if (line.includes("DEBUG")) className = "text-gray-500";
                
                return `<div class="${className} hover:bg-gray-900/50 px-1 rounded">${line}</div>`;
            }).join('');

            if (autoScroll) {
                logContainer.scrollTop = logContainer.scrollHeight;
            }
        } catch (e) {
            console.error("Failed to fetch logs", e);
        }
    }

    // Poll every 2 seconds
    setInterval(fetchLogs, 2000);
    fetchLogs();
</script>
{% endblock %}
