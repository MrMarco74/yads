<div id="queue-widget" class="flex items-center gap-2" hx-target="this" hx-swap="outerHTML">

    <!-- Active Scans + Queue Size -->
    <a href="/queue" class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-700/50 bg-slate-900/50 hover:bg-slate-800 transition-colors text-slate-400 hover:text-white" title="View Queue">
        <!-- Running -->
        <span class="flex items-center gap-1">
            <svg class="w-3.5 h-3.5 {% if active_count > 0 %}text-cyan-400{% else %}text-slate-600{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3l14 9-14 9V3z"/>
            </svg>
            <span class="text-[11px] font-mono font-bold {% if active_count > 0 %}text-cyan-400{% else %}text-slate-600{% endif %}">{{ active_count }}</span>
        </span>
        <span class="text-slate-700">|</span>
        <!-- Queued -->
        <span class="flex items-center gap-1">
            <svg class="w-3.5 h-3.5 {% if queue_length > 0 %}text-amber-400{% else %}text-slate-600{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/>
            </svg>
            <span class="text-[11px] font-mono font-bold {% if queue_length > 0 %}text-amber-400{% else %}text-slate-600{% endif %}">{{ queue_length }}</span>
        </span>
    </a>

    {% if rate_limited_count and rate_limited_count > 0 %}
    <div class="flex items-center gap-1 px-2 py-1 rounded-lg border border-orange-500/30 bg-orange-500/10 text-orange-400"
         title="{{ rate_limited_count }} module(s) currently rate-limited by an external API — retrying automatically">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="text-[10px] font-mono font-bold">{{ rate_limited_count }}</span>
    </div>
    {% endif %}

    <!-- Status Indicator -->
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg border {% if queue_active %}bg-green-500/10 border-green-500/20 text-green-400{% else %}bg-red-500/10 border-red-500/20 text-red-500{% endif %}">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 {% if queue_active %}bg-green-400{% else %}bg-red-400{% endif %}"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 {% if queue_active %}bg-green-500{% else %}bg-red-500{% endif %}"></span>
        </span>
        <span class="text-[10px] font-bold uppercase tracking-wider">
            {% if queue_active %}Active{% else %}Paused{% endif %}
        </span>
    </div>

    <!-- Stop/Resume Button -->
    <button hx-post="/queue/control"
            hx-vals='{"action": "{% if queue_active %}pause{% else %}resume{% endif %}"}'
            class="p-1.5 rounded-lg border transition-all {% if queue_active %}border-red-500/30 text-red-400 hover:bg-red-500/20 hover:text-red-200{% else %}border-green-500/30 text-green-400 hover:bg-green-500/20 hover:text-green-200{% endif %}"
            title="{% if queue_active %}Panic Stop (Pause Queue){% else %}Resume Queue{% endif %}">
        {% if queue_active %}
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% else %}
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% endif %}
    </button>

    <!-- Clear Queue Button -->
    <button hx-post="/queue/purge"
            hx-target="#queue-widget"
            hx-swap="outerHTML"
            hx-confirm="WARNING: This will delete ALL pending tasks in the queue. Are you sure?"
            class="p-1.5 rounded-lg border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors"
            title="Clear Queue">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
    </button>
</div>
