<!-- Global Modals -->
<div id="import-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
        <div class="p-6 border-b border-slate-700 flex justify-between items-center">
            <h3 class="text-xl font-bold text-white">Import Targets</h3>
            <button onclick="document.getElementById('import-modal').classList.add('hidden')" class="text-slate-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form action="/targets/import" method="POST" enctype="multipart/form-data" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Upload File (.txt, .csv)</label>
                <input type="file" name="file_upload" accept=".txt,.csv" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 border border-slate-700 rounded-lg cursor-pointer bg-slate-950 focus:outline-none">
            </div>
            
            <div class="relative">
                <div class="absolute inset-0 flex items-center" aria-hidden="true">
                    <div class="w-full border-t border-slate-700"></div>
                </div>
                <div class="relative flex justify-center">
                    <span class="bg-slate-900 px-2 text-xs text-slate-500 uppercase">Or paste text</span>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Domains (one per line)</label>
                <textarea name="targets_raw" rows="8" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm placeholder-slate-600" placeholder="example.com&#10;sub.domain.org&#10;another-target.net"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Discovery Reason / Justification (Optional)</label>
                <input type="text" name="discovery_reason" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" placeholder="e.g. Requested by CISO for Q3 Audit">
            </div>
            
            <div class="flex items-center gap-2 mb-4">
                <input type="checkbox" id="verify_dns" name="verify_dns" value="true" checked class="w-4 h-4 text-blue-600 bg-slate-800 border-slate-600 rounded focus:ring-blue-500 focus:ring-offset-slate-800">
                <label for="verify_dns" class="text-sm text-slate-300">Verify DNS records (A/AAAA) before importing</label>
            </div>
            
            <!-- Hidden current URL to redirect back -->
            <input type="hidden" name="next" value="{{ request.url.path }}">
            
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="document.getElementById('import-modal').classList.add('hidden')" class="px-4 py-2 bg-slate-800 hover:bg-gray-600 text-slate-200 rounded-lg transition-colors">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg shadow-blue-500/20 transition-all">Import Domains</button>
            </div>
        </form>
    </div>
</div>
