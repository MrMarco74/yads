<!-- Date Range Picker Component -->
{# Usage: {% include 'components/_date_range_picker.html' %} #}
<!-- Requires: date_from, date_to, preset variables in template context -->

<div class="space-y-3">
    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Date Range</label>

    <!-- Preset Buttons -->
    <div class="flex flex-wrap gap-2">
        {% set current_preset = request.query_params.preset or 'all' %}
        {% for p, label in [('1d', '1 Day'), ('7d', '7 Days'), ('30d', '30 Days'), ('90d', '90 Days'), ('1y', '1 Year'), ('all', 'All Time')] %}
        <button type="button"
                onclick="setDatePreset('{{ p }}')"
                class="date-preset-btn px-3 py-1.5 text-xs font-medium rounded-lg transition-all border
                       {% if current_preset == p %}
                       bg-indigo-600 text-white border-indigo-500
                       {% else %}
                       bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700 hover:text-white
                       {% endif %}"
                data-preset="{{ p }}">
            {{ label }}
        </button>
        {% endfor %}
    </div>

    <!-- Custom Date Inputs -->
    <div class="flex gap-3 items-center">
        <div class="flex-1">
            <input type="date"
                   name="date_from"
                   id="date_from"
                   value="{{ request.query_params.date_from or '' }}"
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg py-2 px-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                   onchange="clearPreset()">
        </div>
        <span class="text-slate-500 text-sm">to</span>
        <div class="flex-1">
            <input type="date"
                   name="date_to"
                   id="date_to"
                   value="{{ request.query_params.date_to or '' }}"
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg py-2 px-3 text-sm text-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                   onchange="clearPreset()">
        </div>
    </div>

    <!-- Hidden preset field -->
    <input type="hidden" name="preset" id="date_preset" value="{{ request.query_params.preset or 'all' }}">
</div>

<script>
function setDatePreset(preset) {
    // Update hidden field
    document.getElementById('date_preset').value = preset;

    // Clear custom date inputs when using preset
    document.getElementById('date_from').value = '';
    document.getElementById('date_to').value = '';

    // Update button styles
    document.querySelectorAll('.date-preset-btn').forEach(btn => {
        if (btn.dataset.preset === preset) {
            btn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-700', 'hover:bg-slate-700', 'hover:text-white');
            btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-500');
        } else {
            btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
            btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700', 'hover:bg-slate-700', 'hover:text-white');
        }
    });
}

function clearPreset() {
    // When custom dates are entered, clear the preset
    document.getElementById('date_preset').value = '';

    // Remove active style from all preset buttons
    document.querySelectorAll('.date-preset-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-500');
        btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-700', 'hover:bg-slate-700', 'hover:text-white');
    });
}
</script>
