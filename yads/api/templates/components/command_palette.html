<!-- COMMAND PALETTE (Overlay) -->
<style>
    /* Layer 3 Command Palette Styles extracted for modularity */
    .yads-palette-backdrop {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
        z-index: 9999; display: none; align-items: flex-start; justify-content: center;
        padding-top: 12vh; opacity: 0; transition: opacity 0.15s ease-out;
    }
    .yads-palette-backdrop.active { display: flex; opacity: 1; }
    .yads-palette-container {
        width: 100%; max-width: 650px; background: #0f172a; border: 1px solid #1e293b;
        border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.05);
        overflow: hidden; transform: scale(0.97) translateY(-10px); transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .yads-palette-backdrop.active .yads-palette-container { transform: scale(1) translateY(0); }
    .yads-palette-header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1e293b; }
    .yads-palette-header i { color: #06b6d4; font-size: 16px; margin-right: 16px; }
    .yads-palette-input {
        flex: 1; background: none; border: none; color: #f8fafc; font-size: 18px; outline: none; box-shadow: none;
    }
    .yads-palette-input:focus { outline: none; border: none; box-shadow: none; }
    .yads-palette-content { padding: 8px 0; max-height: 380px; overflow-y: auto; }
    .yads-palette-group-title {
        font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700;
        letter-spacing: 1px; padding: 8px 20px; margin-top: 4px;
    }
    .yads-cmd-item {
        display: flex; align-items: center; padding: 10px 20px; gap: 16px; cursor: pointer; border-left: 2px solid transparent;
    }
    .yads-cmd-item:hover, .yads-cmd-item.selected { background: #1e293b; border-left-color: #06b6d4; }
    .yads-cmd-icon {
        width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.03);
        display: flex; align-items: center; justify-content: center; color: #94A3B8; border: 1px solid rgba(255,255,255,0.05);
    }
    .yads-cmd-item.selected .yads-cmd-icon { background: rgba(6, 182, 212, 0.1); color: #06b6d4; border-color: rgba(6, 182, 212, 0.2); }
    .yads-cmd-details { flex: 1; }
    .yads-cmd-title { font-weight: 500; color: #f8fafc; margin-bottom: 2px; font-size: 13px; }
    .yads-cmd-desc { font-size: 12px; color: #94A3B8; }
    .yads-cmd-hint {
        font-family: monospace; background: #0b0f19; padding: 3px 8px; border-radius: 4px;
        font-size: 11px; color: #94A3B8; border: 1px solid #1e293b;
    }
    .yads-palette-footer {
        padding: 12px 20px; background: #0b0f19; border-top: 1px solid #1e293b;
        display: flex; gap: 16px; font-size: 12px; color: #64748b;
    }
    .yads-palette-footer span b {
        background: #1e293b; padding: 2px 6px; border-radius: 4px; margin-right: 4px; color: #f8fafc; font-weight: 500; border: 1px solid #334155;
    }
</style>

<div class="yads-palette-backdrop" id="yads-palette">
    <div class="yads-palette-container">
        <div class="yads-palette-header">
            <svg class="w-5 h-5 text-cyan-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <input type="text" class="yads-palette-input" id="yads-cmd-input" placeholder="Type a command or search..." autocomplete="off" spellcheck="false">
        </div>
        <div class="yads-palette-content" id="yads-dynamic-cmds">
            <!-- Rendered JS -->
        </div>
        <div class="yads-palette-footer">
            <span><b>↑↓</b> Navigate</span>
            <span><b>Enter</b> Execute</span>
            <span><b>Esc</b> Close</span>
        </div>
    </div>
</div>

<script>
    const yadsPalette = document.getElementById('yads-palette');
    const yadsInput = document.getElementById('yads-cmd-input');
    const yadsContentGroup = document.getElementById('yads-dynamic-cmds');

    let yadsCommands = [
        // --- 💡 Fallback Suggestions (Static) ---
        { group: 'Suggestions', prefix: '', title: '>scan profile=dashboard', desc: 'Trigger standard scan queue', hint: 'Action', url: '/queue' },
        { group: 'Suggestions', prefix: '', title: '@global-search', desc: 'Search targets & IPs', hint: 'Search', url: '/search?q=' },
        { group: 'Suggestions', prefix: '', title: '!critical !new', desc: 'View critical incidents', hint: 'Filter', url: '/security-findings?severity=critical' }
    ];

    async function yfetchSuggestions() {
        try {
            const resp = await fetch('/api/search/suggestions');
            if (resp.ok) {
                const data = await resp.json();
                if (Array.isArray(data) && data.length > 0) {
                    yadsCommands = data;
                    console.log(`[YADS] Loaded ${yadsCommands.length} dynamic search commands`);
                }
            }
        } catch (err) {
            console.error('[YADS] Failed to fetch search suggestions:', err);
        }
    }

    // Initialize fetching
    yfetchSuggestions();

    let yselectedIndex = 0;

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            toggleYadsPalette(true);
        }
        if (!yadsPalette.classList.contains('active')) return;

        if (e.key === 'Escape') {
            toggleYadsPalette(false);
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            yselectItem(1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            yselectItem(-1);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            const items = document.querySelectorAll('.yads-cmd-item');
            if(items.length > 0 && items[yselectedIndex]) {
                const url = items[yselectedIndex].dataset.url;
                if(url) {
                    if (url.includes('?q=')) {
                        globalThis.location.href = url + encodeURIComponent(yadsInput.value);
                    } else {
                        globalThis.location.href = url;
                    }
                }
            }
            toggleYadsPalette(false);
        }
    });

    function yselectItem(dir) {
        const items = document.querySelectorAll('.yads-cmd-item');
        if(items.length === 0) return;
        items[yselectedIndex].classList.remove('selected');
        yselectedIndex = (yselectedIndex + dir + items.length) % items.length;
        const newItem = items[yselectedIndex];
        newItem.classList.add('selected');
        newItem.scrollIntoView({ block: 'nearest' });
    }

    function toggleYadsPalette(state) {
        if (state === undefined) state = !yadsPalette.classList.contains('active');
        if (state) {
            yadsPalette.classList.add('active');
            yadsInput.value = '';
            yrenderCommands('');
            setTimeout(() => yadsInput.focus(), 100);
            // Refresh on open if possible, but don't block
            yfetchSuggestions();
        } else {
            yadsPalette.classList.remove('active');
            yadsInput.blur();
        }
    }

    // Allow clicking on backdrop to close
    yadsPalette.addEventListener('click', (e) => {
        if(e.target === yadsPalette) toggleYadsPalette(false);
    });

    yadsInput.addEventListener('input', (e) => {
        yrenderCommands(e.target.value);
    });

    function yrenderCommands(query) {
        yadsContentGroup.innerHTML = '';
        yselectedIndex = 0;
        
        let stateTitle = 'Quick Workflows';
        let filtered = [];

        const firstChar = query.charAt(0);
        if (['>', '@', '!', '/'].includes(firstChar)) {
            filtered = yadsCommands.filter(c => c.prefix === firstChar);
            if (firstChar === '>') stateTitle = 'Execution (Actions)';
            if (firstChar === '@') stateTitle = 'Navigation (Assets & Targets)';
            if (firstChar === '!') stateTitle = 'Filters (Triage)';
            if (firstChar === '/') stateTitle = 'Marketplace & System';
        } else if (query.length > 0) {
            stateTitle = 'Search Results';
            filtered = yadsCommands.filter(c => c.title.toLowerCase().includes(query.toLowerCase()) || (c.prefix === '' && c.title.includes(query)));
        } else {
            filtered = yadsCommands.filter(c => c.group === 'Suggestions' || c.prefix === '');
        }

        let html = `<div class="yads-palette-group-title">${stateTitle}</div>`;

        if (filtered.length === 0) {
            html += `<div class="yads-cmd-item"><div class="yads-cmd-desc">No commands mapped for "${query}". Press Enter to run global search.</div></div>`;
            // Add a fallback search
            filtered.push({ title: `Search "${query}" directly`, url: '/search?q=' + encodeURIComponent(query), hint: 'Search', icon: 'M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z' });
        }
        
        filtered.forEach((cmd, idx) => {
            let svgIcon = cmd.icon || 'M13 10V3L4 14h7v7l9-11h-7z'; // default lightning
            html += `
            <div class="yads-cmd-item ${idx === 0 ? 'selected' : ''}" data-url="${cmd.url}" onclick="window.location.href='${cmd.url}'">
                <div class="yads-cmd-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${svgIcon}"></path></svg>
                </div>
                <div class="yads-cmd-details">
                    <div class="yads-cmd-title">${cmd.title}</div>
                    <div class="yads-cmd-desc">${cmd.desc || ''}</div>
                </div>
                <div class="yads-cmd-hint">${cmd.hint}</div>
            </div>`;
        });
        
        yadsContentGroup.innerHTML = html;
    }
</script>
