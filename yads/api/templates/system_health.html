{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-[1200px]">

    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                Operations Center
            </h1>
            <p class="text-slate-400 text-sm mt-1">
                Live-Übersicht aller Services, Worker und System-Alerts
            </p>
        </div>
        <div class="flex items-center gap-3">
            <a href="/system/alerts" class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                Alert-Verlauf
            </a>
            <a href="/workers" class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/>
                </svg>
                Worker-Monitor
            </a>
            <a href="/workers/logs" class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Logs
            </a>
        </div>
    </div>

    <!-- Live content — polled every 30s via HTMX -->
    <div id="health-summary"
         hx-get="/api/system/health-summary"
         hx-trigger="load"
         hx-swap="outerHTML">

        <!-- Loading skeleton -->
        <div class="animate-pulse space-y-4">
            <div class="grid grid-cols-4 gap-3">
                {% for _ in range(4) %}
                <div class="h-20 rounded-xl bg-slate-800/60"></div>
                {% endfor %}
            </div>
            <div class="h-12 rounded-xl bg-slate-800/60"></div>
            <div class="h-24 rounded-xl bg-slate-800/60"></div>
            <div class="grid grid-cols-4 gap-3">
                {% for _ in range(4) %}
                <div class="h-16 rounded-xl bg-slate-800/60"></div>
                {% endfor %}
            </div>
        </div>

    </div>

</div>
{% endblock %}
