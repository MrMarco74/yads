{% extends "base.html" %}

{% block main_classes %}flex-1 flex flex-col items-center justify-center w-full{% endblock %}

{% block content %}
    <div class="w-full p-8 bg-gray-800 rounded-xl shadow-2xl border border-gray-700" style="max-width: 450px;">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="mx-auto w-12 h-12 bg-blue-900/50 rounded-full flex items-center justify-center mb-4 border border-blue-500/30">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white">Change Password</h2>
            <p class="text-gray-400 text-sm mt-2">Please update your password to continue.</p>
        </div>

        {% if error %}
        <div class="p-4 mb-6 text-sm text-red-200 bg-red-900/50 rounded-lg border border-red-800 flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="/auth/change-password">
            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-300 mb-2" for="new_password">New Password</label>
                <div class="flex gap-4">
                    <input type="password" name="new_password" id="new_password" required autofocus oninput="checkStrength()" autocomplete="new-password"
                           class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-500 transition-all outline-none shadow-sm">
                    <button type="button" onclick="generateRandomPassword()" class="px-5 py-3 font-medium text-gray-300 bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-lg transition-colors whitespace-nowrap shadow-sm">
                        Suggest
                    </button>
                </div>
                
                <!-- BSI Compliance Meter -->
                <div class="mt-4 p-3 bg-gray-900/50 rounded-lg border border-gray-700/50">
                     <div class="h-2 w-full bg-gray-700 rounded-full overflow-hidden mb-2">
                        <div id="strength-bar" class="h-full bg-gray-600 w-0 transition-all duration-300 ease-out"></div>
                     </div>
                     <div class="flex justify-between items-center text-xs">
                         <span class="text-gray-400 font-medium tracking-wide">STRENGTH</span>
                         <span id="strength-text" class="font-mono text-gray-500">Min 8 chars</span>
                     </div>
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-300 mb-2" for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required autocomplete="new-password"
                       class="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-500 transition-all outline-none shadow-sm">
            </div>

            <div>
                <button type="submit" class="w-full h-14 py-4 px-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg shadow-blue-500/30 transition-all transform hover:scale-[1.01] focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 ring-offset-gray-800 tracking-wide text-sm uppercase flex items-center justify-center">
                    Update Password
                </button>
            </div>
        </form>
    </div>

<script>
    function generateRandomPassword() {
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        let password = "";
        for (let i = 0; i < 20; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        const input = document.getElementById("new_password");
        input.value = password;
        input.type = "text"; // Show password so user can see/copy it
        checkStrength();
    }

    function checkStrength() {
        const val = document.getElementById("new_password").value;
        const bar = document.getElementById("strength-bar");
        const txt = document.getElementById("strength-text");
        
        if (!val) {
            bar.style.width = "0%";
            bar.className = "h-full bg-gray-600 transition-all duration-300 ease-out";
            txt.textContent = "";
            txt.className = "font-medium text-gray-500";
            return;
        }

        let score = 0;
        if (val.length >= 8) score += 1;
        if (val.length >= 12) score += 1;
        if (val.length >= 16) score += 1;
        
        if (/[A-Z]/.test(val)) score += 1;
        if (/[a-z]/.test(val)) score += 1;
        if (/[0-9]/.test(val)) score += 1;
        if (/[^A-Za-z0-9]/.test(val)) score += 1;

        let color = "bg-red-600";
        let label = "Weak";
        let width = "10%";
        let textColor = "text-red-500";
        
        if (val.length < 8) {
            label = "Too Short (<8)";
            width = "10%";
            color = "bg-red-600";
            textColor = "text-red-500";
        } else if (score < 4) {
            color = "bg-orange-500";
            label = "Weak";
            textColor = "text-orange-500";
            width = "30%";
        } else if (score < 6) {
            color = "bg-yellow-400";
            label = "Moderate";
            textColor = "text-yellow-400";
            width = "60%";
        } else {
            color = "bg-green-500";
            label = "Strong (BSI Compliant)";
            textColor = "text-green-500";
            width = "100%";
        }
        
        bar.className = `h-full ${color} transition-all duration-300 ease-out`;
        bar.style.width = width;
        txt.textContent = label;
        txt.className = `font-medium ${textColor}`;
    }
</script>
{% endblock %}
