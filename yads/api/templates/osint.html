{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-white tracking-tight">OSINT Brand Monitoring</h1>
        <p class="mt-2 text-sm text-slate-400">
            Upload your brand logos to search for their usage across the web. 
            Identify shadow IT, phishing sites, or unauthorized brand usage.
        </p>
    </div>

    <!-- Main Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
        <div class="p-6 sm:p-8">
            
            <!-- Upload Form -->
            <form hx-post="/osint/search" hx-encoding="multipart/form-data" hx-target="#results-container" hx-indicator="#loading-indicator">
                
                <div class="space-y-6">
                    <!-- Drop Zone -->
                    <div class="flex justify-center items-center w-full">
                        <label for="dropzone-file" class="flex flex-col justify-center items-center w-full h-64 bg-slate-950/50 rounded-lg border-2 border-dashed border-slate-700 cursor-pointer hover:bg-slate-800/50 hover:border-cyan-500/50 transition-all group">
                            <div class="flex flex-col justify-center items-center pt-5 pb-6">
                                <svg class="mb-4 w-10 h-10 text-slate-500 group-hover:text-cyan-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <p class="mb-2 text-sm text-slate-400"><span class="font-semibold text-slate-200">Click to upload</span> or drag and drop</p>
                                <p class="text-xs text-slate-500">SVG, PNG, JPG or GIF (MAX. 5 files)</p>
                            </div>
                            <input id="dropzone-file" name="files" type="file" class="hidden" multiple accept="image/*" />
                        </label>
                    </div>

                    <!-- Hidden Test Input (Optional) -->
                    <div x-data="{ showAdvanced: false }">
                        <button type="button" @click="showAdvanced = !showAdvanced" class="px-3 py-1.5 text-xs font-medium text-slate-400 bg-slate-800/50 border border-slate-700 rounded-lg hover:bg-slate-700 hover:text-white transition-colors flex items-center gap-2">
                            <svg class="w-3 h-3" :class="showAdvanced ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            Advanced Options
                        </button>
                        <div x-show="showAdvanced" class="mt-3 animate-fade-in-down">
                             <label class="block mb-1 text-xs text-slate-400">Test Domain Override (Mock Injection)</label>
                             <input type="text" name="test_domain" placeholder="example-phishing.com" class="bg-slate-950 border border-slate-800 text-slate-300 text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5">
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex justify-end pt-4 border-t border-slate-800">
                        <button id="searchButton" type="submit" disabled class="opacity-50 cursor-not-allowed text-white bg-blue-600 hover:bg-blue-500 focus:ring-4 focus:ring-blue-800 font-bold rounded-lg text-sm px-6 py-2.5 text-center flex items-center gap-2 shadow-lg shadow-blue-500/20 transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            Start Search
                        </button>
                    </div>
                </div>
            </form>
            
            <script>
                // Drag and Drop & File Preview Logic
                const dropzone = document.getElementById('dropzone-file').closest('label');
                const fileInput = document.getElementById('dropzone-file');
                const searchBtn = document.getElementById('searchButton');
                
                // Visual helpers
                const defaultText = dropzone.querySelector('div').innerHTML;
                
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropzone.addEventListener(eventName, preventDefaults, false);
                });
                
                function preventDefaults(e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                
                ['dragenter', 'dragover'].forEach(eventName => {
                    dropzone.addEventListener(eventName, highlight, false);
                });
                
                ['dragleave', 'drop'].forEach(eventName => {
                    dropzone.addEventListener(eventName, unhighlight, false);
                });
                
                function highlight(e) {
                    dropzone.classList.add('bg-slate-800', 'border-cyan-500');
                }
                
                function unhighlight(e) {
                    dropzone.classList.remove('bg-slate-800', 'border-cyan-500');
                }
                
                dropzone.addEventListener('drop', handleDrop, false);
                
                function handleDrop(e) {
                    const dt = e.dataTransfer;
                    const files = dt.files;
                    handleFiles(files);
                }
                
                fileInput.addEventListener('change', function() {
                    handleFiles(this.files);
                });
                
                function handleFiles(files) {
                    // Update input manually if coming from drop
                    if (fileInput.files !== files) {
                        fileInput.files = files; // Works in modern browsers
                    }
                    
                    if (files.length > 0) {
                        updatePreview(files);
                        searchBtn.disabled = false;
                        searchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                }
                
                function updatePreview(files) {
                    const count = files.length;
                    const names = Array.from(files).map(f => f.name).join(', ');
                    
                    dropzone.querySelector('div').innerHTML = `
                        <svg class="mb-4 w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="mb-2 text-sm text-slate-200 font-semibold">${count} file(s) selected</p>
                        <p class="text-xs text-slate-500 truncate max-w-xs">${names}</p>
                    `;
                }
            </script>
            
            <!-- Loading State -->
            <div id="loading-indicator" class="htmx-indicator py-12 text-center">
                 <div role="status">
                    <svg aria-hidden="true" class="inline w-10 h-10 text-slate-800 animate-spin fill-cyan-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                        <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
                    </svg>
                    <span class="sr-only">Loading...</span>
                    <p class="mt-4 text-sm text-slate-500">Analyzing images and searching across 100+ sources...</p>
                </div>
            </div>

            <!-- Results Container -->
            <div id="results-container" class="mt-8 transition-all">
                <!-- Results will be injected here -->
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
