<!-- OSINT GRAPH CARD -->
<div class="bg-gray-800/50 border border-indigo-500/20 rounded-xl p-6 shadow-lg backdrop-blur-sm relative overflow-hidden">
    <div class="flex items-center justify-between mb-4 relative z-10">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-500/10 rounded-lg text-indigo-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            </div>
            <h2 class="text-xl font-semibold text-white">OSINT Intelligence Graph</h2>
        </div>
        <button id="renderOsintGraphBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition-colors focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            Render Graph
        </button>
    </div>

    <div class="w-full h-[500px] bg-[#0f172a] rounded-lg border border-gray-700 relative z-10" id="osintGraphContainer">
        <!-- Overlay until rendered -->
        <div id="osintGraphOverlay" class="absolute inset-0 bg-gray-900/80 flex flex-col items-center justify-center z-20 rounded-lg">
            <svg class="w-12 h-12 text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16l2.879-2.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-gray-400 font-mono text-sm">Click 'Render Graph' to load intelligence relationships.</p>
        </div>
        
        <div id="osintCy" class="w-full h-full block"></div>
    </div>
</div>

<script src="/static/vendor/cytoscape.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const targetId = {{ target.id }};
        const renderBtn = document.getElementById('renderOsintGraphBtn');
        const overlay = document.getElementById('osintGraphOverlay');
        let cyOsint = null;

        renderBtn.addEventListener('click', async () => {
            if (cyOsint) cyOsint.destroy();
            
            overlay.innerHTML = '<div class="flex flex-col items-center"><svg class="animate-spin h-8 w-8 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span class="text-indigo-400 text-sm font-mono tracking-wider">Loading correlation data...</span></div>';
            overlay.style.display = 'flex';
            
            try {
                const response = await fetch(`/osint/target/${targetId}/graph`);
                if (!response.ok) throw new Error('Failed to fetch graph data');
                const data = await response.json();
                
                if (data.nodes.length <= 1) { 
                     overlay.innerHTML = '<div class="text-gray-400 font-mono">No extended OSINT relationships found.</div>';
                     return;
                }
                
                overlay.style.display = 'none';

                cyOsint = cytoscape({
                    container: document.getElementById('osintCy'),
                    elements: { nodes: data.nodes, edges: data.edges },
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#64748b',
                                'label': 'data(label)',
                                'color': '#e2e8f0',
                                'font-size': '10px',
                                'text-valign': 'top',
                                'text-halign': 'center',
                                'width': '25px',
                                'height': '25px',
                                'text-wrap': 'wrap',
                                'text-max-width': '120px',
                                'text-outline-color': '#0f172a',
                                'text-outline-width': 2
                            }
                        },
                        { selector: 'node[type="target"]', style: { 'background-color': '#4f46e5', 'width': 40, 'height': 40, 'font-size': '12px', 'color': '#fff', 'shape': 'hexagon' } },
                        { selector: 'node[group="tech"]', style: { 'background-color': '#0ea5e9', 'shape': 'round-rectangle', 'width': 30, 'border-width': 2, 'border-color': '#bae6fd' } },
                        { selector: 'node[group="leak"]', style: { 'background-color': '#ef4444', 'shape': 'diamond', 'width': 30, 'height': 30 } },
                        { selector: 'node[group="social"]', style: { 'background-color': '#8b5cf6' } },
                        { selector: 'node[group="identity"]', style: { 'background-color': '#f59e0b', 'shape': 'star' } },
                        { selector: 'node[group="infrastructure"]', style: { 'background-color': '#10b981', 'shape': 'rectangle', 'width': 30 } },
                        { selector: 'node[group="certificate"]', style: { 'background-color': '#14b8a6' } },
                        { selector: 'node[group="domain"]', style: { 'background-color': '#6366f1', 'shape': 'triangle' } },
                        {
                            selector: 'edge',
                            style: {
                                'width': 1.5,
                                'line-color': '#475569',
                                'target-arrow-color': '#475569',
                                'target-arrow-shape': 'triangle',
                                'curve-style': 'bezier',
                                'label': 'data(label)',
                                'font-size': '8px',
                                'color': '#94a3b8',
                                'text-rotation': 'autorotate',
                                'text-background-color': '#0f172a',
                                'text-background-opacity': 0.8,
                                'text-background-padding': '2px',
                                'text-background-shape': 'roundrectangle'
                            }
                        }
                    ],
                    layout: {
                        name: 'cose',
                        padding: 30,
                        nodeRepulsion: function( node ){ return 204800; },
                        nodeOverlap: 10,
                        idealEdgeLength: function( edge ){ return 100; },
                        edgeElasticity: function( edge ){ return 100; },
                        nestingFactor: 5,
                        gravity: 250,
                        numIter: 1000,
                        initialTemp: 200,
                        coolingFactor: 0.95,
                        minTemp: 1.0,
                        animate: true
                    }
                });
            } catch(e) {
                console.error(e);
                overlay.innerHTML = '<div class="text-red-500 font-mono text-sm">Failed to render graph. Check network logs.</div>';
            }
        });
    });
</script>
