    <!-- CHANGE HISTORY SECTION -->
    <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl shadow-lg overflow-hidden mt-2">
        <details id="change-history-section">
            <summary class="flex items-center justify-between cursor-pointer p-5 hover:bg-gray-700/30 transition-colors select-none group">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-amber-500/10 rounded-lg text-amber-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-semibold text-white">Change History</h2>
                        <p class="text-xs text-gray-400">All detected changes across scanner modules for this target.</p>
                    </div>
                </div>
                <svg class="w-5 h-5 text-gray-400 transform transition-transform" style="transform: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </summary>
            <div id="change-history-body" class="p-5 border-t border-gray-700/50">
                <p class="text-center text-gray-500 text-sm py-6 animate-pulse">Loading change history...</p>
            </div>
        </details>
    </div>

    <script>
    (function() {
        var loaded = false;
        var el = document.getElementById('change-history-section');
        if (!el) return;
        el.addEventListener('toggle', function() {
            if (!el.open || loaded) return;
            loaded = true;
            var body = document.getElementById('change-history-body');
            fetch('/targets/{{ target.id }}/changes?limit=30')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!Array.isArray(data) || data.length === 0) {
                        body.innerHTML = '<p class="text-center text-gray-500 text-sm py-6 italic">No change events recorded yet.</p>';
                        return;
                    }
                    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
                    var rows = data.map(function(c) {
                        var dt = new Date(c.detected_at);
                        var dateStr = dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                        return '<tr class="border-b border-gray-700/40 hover:bg-gray-700/20 transition-colors">'
                            + '<td class="px-4 py-2.5 text-xs text-gray-400 whitespace-nowrap font-mono">' + dateStr + '</td>'
                            + '<td class="px-4 py-2.5"><span class="text-xs bg-indigo-900/50 text-indigo-300 px-2 py-0.5 rounded font-mono border border-indigo-700/30">' + esc(c.module_name) + '</span></td>'
                            + '<td class="px-4 py-2.5 text-xs text-gray-500 uppercase tracking-wider font-mono">' + esc(c.event_type) + '</td>'
                            + '<td class="px-4 py-2.5 text-sm text-slate-300">' + esc(c.description) + '</td>'
                            + '</tr>';
                    }).join('');
                    body.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-left">'
                        + '<thead><tr class="border-b border-gray-700">'
                        + '<th class="px-4 py-2 text-xs font-bold text-gray-500 uppercase tracking-wider">Date</th>'
                        + '<th class="px-4 py-2 text-xs font-bold text-gray-500 uppercase tracking-wider">Module</th>'
                        + '<th class="px-4 py-2 text-xs font-bold text-gray-500 uppercase tracking-wider">Type</th>'
                        + '<th class="px-4 py-2 text-xs font-bold text-gray-500 uppercase tracking-wider">Description</th>'
                        + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
                })
                .catch(function() {
                    body.innerHTML = '<p class="text-center text-red-400 text-sm py-4">Failed to load change history.</p>';
                });
        });
    })();
    </script>
