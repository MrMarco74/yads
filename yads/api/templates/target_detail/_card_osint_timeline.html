<!-- OSINT TIMELINE CARD -->
<div class="bg-gray-800/50 border border-indigo-500/20 rounded-xl p-6 shadow-lg backdrop-blur-sm relative overflow-hidden mt-6">
    <div class="flex items-center justify-between mb-6 relative z-10">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-500/10 rounded-lg text-indigo-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-xl font-semibold text-white">OSINT Intelligence Timeline</h2>
        </div>
        <button id="loadOsintTimelineBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-sm font-medium transition-colors focus:ring-2 focus:ring-gray-500 focus:outline-none flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Refresh Feed
        </button>
    </div>

    <div class="relative z-10" id="osintTimelineContainer">
        <div id="osintTimelineLoading" class="py-12 flex flex-col items-center justify-center">
            <svg class="animate-spin h-8 w-8 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span class="text-indigo-400 text-sm font-mono tracking-wider">Loading history...</span>
        </div>
        
        <!-- Timeline Content -->
        <div id="osintTimelineContent" class="hidden">
            <div class="relative border-l border-gray-700 ml-3 space-y-6" id="osintTimelineList">
                <!-- Items injected here by JS -->
            </div>
        </div>
        
        <div id="osintTimelineEmpty" class="hidden py-8 text-center text-gray-500 italic">
            No intelligence records gathered yet. Run OSINT scans to populate.
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const targetId = {{ target.id }};
        const loadBtn = document.getElementById('loadOsintTimelineBtn');
        const listContainer = document.getElementById('osintTimelineList');
        const loadingDiv = document.getElementById('osintTimelineLoading');
        const contentDiv = document.getElementById('osintTimelineContent');
        const emptyDiv = document.getElementById('osintTimelineEmpty');

        const loadTimeline = async () => {
            loadingDiv.classList.remove('hidden');
            contentDiv.classList.add('hidden');
            emptyDiv.classList.add('hidden');
            
            try {
                const response = await fetch(`/osint/target/${targetId}`);
                if (!response.ok) throw new Error('Failed to fetch timeline data');
                const records = await response.json();
                
                if (!records || records.length === 0) {
                     loadingDiv.classList.add('hidden');
                     emptyDiv.classList.remove('hidden');
                     return;
                }
                
                listContainer.innerHTML = '';
                
                records.forEach(record => {
                    const dateObj = new Date(record.timestamp);
                    const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString();
                    
                    let iconSVG = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
                    let iconColor = 'bg-gray-700 text-gray-300';
                    let title = record.data_type.replace('_', ' ').toUpperCase();
                    let detailHTML = '';
                    
                    if (record.module_name === 'leaked_credentials') {
                        iconColor = 'bg-red-900 text-red-400 border border-red-700';
                        iconSVG = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>';
                        detailHTML = `<div class="font-semibold text-red-400">Breach: ${record.data_json.name || 'Unknown'}</div><div class="text-gray-400 text-xs mt-1">Found in leak database compilation.</div>`;
                    }
                    else if (record.data_type === 'tech_stack') {
                        iconColor = 'bg-blue-900 text-blue-400 border border-blue-700';
                        iconSVG = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>';
                        detailHTML = `<div class="font-medium text-blue-300">${record.data_json.name}</div><div class="text-gray-400 text-xs">Version: ${record.data_json.version || 'Unknown'}</div>`;
                    }
                    else if (record.data_type === 'social_profile') {
                        iconColor = 'bg-purple-900 text-purple-400 border border-purple-700';
                        iconSVG = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>';
                        detailHTML = `<a href="${record.data_json.url}" target="_blank" class="text-purple-300 hover:text-purple-200 underline">${record.data_json.platform}: @${record.data_json.username}</a>`;
                    }
                    else if (record.data_type === 'historical_dns' || record.data_type === 'historical_ip') {
                        iconColor = 'bg-emerald-900 text-emerald-400 border border-emerald-700';
                        iconSVG = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>';
                        detailHTML = `<div class="text-emerald-300 font-mono text-xs">${record.data_json.subdomain || 'Root'} -> ${record.data_json.ip || 'Unknown'}</div>`;
                    }
                    else {
                        // Generic Fallback
                        detailHTML = `<pre class="text-[10px] text-gray-500 overflow-x-auto whitespace-pre-wrap">${JSON.stringify(record.data_json, null, 2)}</pre>`;
                    }

                    const itemHTML = `
                        <div class="relative pl-6">
                            <span class="absolute -left-[13px] top-1 flex items-center justify-center w-6 h-6 rounded-full ring-4 ring-gray-900 ${iconColor}">
                                ${iconSVG}
                            </span>
                            <div class="bg-gray-900/40 border border-gray-700/50 rounded-lg p-3 hover:bg-gray-800/60 transition-colors">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="text-sm font-semibold text-gray-200">${title}</h3>
                                    <time class="mb-1 text-xs font-normal text-gray-500 font-mono">${dateStr}</time>
                                </div>
                                <div class="text-sm text-gray-400">
                                    ${detailHTML}
                                </div>
                                <div class="mt-2 text-[10px] text-gray-600 uppercase tracking-widest font-semibold flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                    Module: ${record.module_name}
                                </div>
                            </div>
                        </div>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', itemHTML);
                });
                
                loadingDiv.classList.add('hidden');
                contentDiv.classList.remove('hidden');
                
            } catch(e) {
                console.error(e);
                loadingDiv.innerHTML = '<div class="text-red-500 font-mono text-sm">Failed to load timeline.</div>';
            }
        };

        loadBtn.addEventListener('click', loadTimeline);
        
        // Auto-load once on ready
        loadTimeline();
    });
</script>
