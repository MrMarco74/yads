<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YADS - Security Dashboard</title>
    <link href="/static/css/main.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
      body {
        background-color: #0b0f19; /* Very deep blue/black */
        color: #e5e7eb;
      }
      /* Custom scrollbar for logs */
      .log-container::-webkit-scrollbar {
        width: 8px;
      }
      .log-container::-webkit-scrollbar-track {
        background: #1f2937;
      }
      .log-container::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="min-h-screen font-sans antialiased">
    <nav
      class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-sm sticky top-0 z-50"
    >
      <div class="w-full mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center">
            <a href="/" class="flex-shrink-0 flex items-center gap-3">
              <img src="/static/logo.jpg" alt="YADS Logo" class="h-10 w-auto rounded-lg shadow-lg shadow-cyan-500/20">
              <span
                class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-cyan-400"
              >
                YADS
              </span>
            </a>
            <!-- Search Bar -->
            <div class="hidden md:flex ml-4 flex-1 max-w-xs">
                 <form action="/search" method="GET" class="w-full relative">
                    <input type="text" name="q" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-10 pr-4 py-1.5 text-sm text-gray-300 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                           placeholder="Search...">
                    <svg class="w-4 h-4 text-gray-500 absolute left-3 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </form>
            </div>

            <div class="hidden md:block">
              <div class="ml-4 flex items-baseline space-x-4">
                <a
                  href="/"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors"
                  >Dashboard</a
                >
                <a
                  href="/targets/table"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors"
                  >Table View</a
                >
                <a
                  href="/visualizations/network-graph"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors"
                  >Network Graph</a
                >
                <a
                  href="/analytics"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors text-yellow-400"
                  >Analytics</a
                >
                <a
                  href="/visualizations/redirect-graph"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors text-indigo-400"
                  >Spiderweb</a
                >
                <a
                  href="/logs"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors"
                  >System Logs</a
                >
                <a
                  href="/queue"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors"
                  >Queue</a
                >
                <a
                  href="/settings"
                  class="hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors"
                  >Settings</a
                >
              </div>
            </div>
          </div>
          <div>
            <span
              class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-900 text-green-200 border border-green-700"
            >
              System Online
            </span>
          </div>
        </div>
      </div>
    </nav>

    <main class="w-full mx-auto py-6 sm:px-6 lg:px-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
