{% extends "base.html" %}

{% block content %}
<div class="h-[calc(100vh-8rem)] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Network Graph (Spiderweb)</h1>
            <p class="text-sm text-slate-400">Visualizing relationships between domains, subdomains, IPs, and external links.</p>
        </div>
        <div class="flex items-center gap-4">
             <!-- Attack Path Toggle -->
            <label class="relative inline-flex items-center cursor-pointer group">
                <input type="checkbox" id="attackPathToggle" class="sr-only peer">
                <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
                <span class="ml-3 text-sm font-medium text-slate-300 group-hover:text-white transition-colors">Attack Paths</span>
            </label>

            <select id="layoutSelect" class="bg-slate-800 text-white text-sm rounded-lg border border-slate-700 p-2.5">
                <option value="cose">Force Directed (Cose)</option>
                <option value="circle">Circle</option>
                <option value="breadthfirst">Tree</option>
                <option value="grid">Grid</option>
            </select>
             <button onclick="cy.fit()" class="p-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg border border-slate-700">
                Fit to Screen
            </button>
        </div>
    </div>

    <!-- Graph Container -->
    <div class="flex-1 bg-slate-900 rounded-xl border border-slate-800 relative overflow-hidden">
        <div id="cy" class="w-full h-full block"></div>
        
        <!-- Loading Overlay -->
        <div id="loading" class="absolute inset-0 bg-slate-900/80 flex items-center justify-center z-10 transition-opacity duration-300">
             <div class="flex flex-col items-center">
                <svg class="animate-spin h-10 w-10 text-indigo-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-white font-medium">Building Graph...</span>
             </div>
        </div>

        <!-- Legend -->
        <div class="absolute bottom-4 left-4 bg-slate-900/90 border border-slate-700 p-3 rounded-lg text-xs text-white z-20 backdrop-blur-sm">
            <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 rounded-full bg-indigo-500"></span> Domain</div>
            <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 rounded-full bg-sky-500"></span> Subdomain</div>
            <div class="flex items-center gap-2 mb-1"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> IP Address</div>
            <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-500"></span> External/Link</div>
             <div class="flex items-center gap-2 mt-2 pt-2 border-t border-slate-700 text-red-400 font-bold" id="riskLegend" style="display:none;">
                <span class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></span> Compromised / Risk
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>

<script>
    let cy = null;

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const resp = await fetch('/api/visualizations/network');
            const data = await resp.json();
            
            // Hide loading
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => document.getElementById('loading').style.display = 'none', 300);

            if (data.nodes.length === 0) {
                 // specific empty state?
            }

            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: {
                    nodes: data.nodes,
                    edges: data.edges
                },
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': '#64748b',
                            'label': 'data(label)',
                            'color': '#cbd5e1',
                            'font-size': '10px',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'width': '20px',
                            'height': '20px',
                            'text-wrap': 'wrap',
                             'text-max-width': '80px'
                        }
                    },
                    {
                        selector: 'node[type="domain"]',
                        style: {
                            'background-color': '#6366f1',
                            'width': '40px',
                            'height': '40px',
                            'font-weight': 'bold',
                             'font-size': '12px'
                        }
                    },
                    {
                         selector: 'node[type="subdomain"]',
                         style: { 'background-color': '#0ea5e9', 'width': '15px', 'height': '15px' }
                    },
                    {
                         selector: 'node[type="ip"]',
                         style: { 'background-color': '#10b981', 'shape': 'rectangle', 'width': '25px', 'height': '25px' }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 1,
                            'line-color': '#334155',
                            'target-arrow-color': '#334155',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'opacity': 0.5
                        }
                    },
                    // Attack Path Styles
                    {
                        selector: '.compromised-node',
                        style: {
                            'background-color': '#dc2626', // Red
                            'border-width': 2,
                            'border-color': '#fca5a5',
                            'text-outline-color': '#dc2626',
                            'text-outline-width': 2,
                            'z-index': 999
                        }
                    },
                    {
                        selector: '.risk-edge',
                        style: {
                            'line-color': '#ef4444',
                            'target-arrow-color': '#ef4444',
                            'width': 2,
                            'opacity': 1
                        }
                    }
                ],
                layout: {
                    name: 'cose',
                    animate: true,
                    padding: 50,
                    nodeRepulsion: 4500,
                    idealEdgeLength: 50
                }
            });
            
            // Tooltip via Titles (simple)
            cy.on('mouseover', 'node', function(event) {
                const node = event.target;
                const riskInfo = node.data('compromised') ? `\n⚠️ RISK: ${node.data('risk_reasons')}` : '';
                document.body.title = `${node.data('label')} (${node.data('type')})${riskInfo}`; 
                // Quick hack for native tooltip, better to use tippy.js in real prod but this is simple.
            });

            // Toggle Logic
            const toggle = document.getElementById('attackPathToggle');
            const riskLegend = document.getElementById('riskLegend');
            
            toggle.addEventListener('change', (e) => {
                const showAttackPath = e.target.checked;
                
                if (showAttackPath) {
                    riskLegend.style.display = 'flex';
                    
                    // Highlight Compromised Nodes
                    cy.batch(() => {
                         cy.nodes().forEach(node => {
                              if (node.data('compromised')) {
                                   node.addClass('compromised-node');
                              } else {
                                  // Dim others?
                                  node.style('opacity', 0.2);
                              }
                         });
                         
                         // Highlight Risk Edges
                         cy.edges().forEach(edge => {
                              if (edge.data('is_risk')) {
                                   edge.addClass('risk-edge');
                              } else {
                                  edge.style('opacity', 0.1);
                              }
                         });
                         
                         // Ensure non-compromised nodes connected to risk edges are visible?
                         // Or just highlight the path.
                         // Logic above: Dim everything else.
                         
                         // Special case: If a node is NOT compromised but part of a risk edge (destination), keep it visible
                         cy.edges('.risk-edge').targets().style('opacity', 1);
                         cy.edges('.risk-edge').sources().style('opacity', 1);
                    });
                    
                } else {
                    riskLegend.style.display = 'none';
                    cy.batch(() => {
                        cy.nodes().removeClass('compromised-node').style('opacity', 1);
                        cy.edges().removeClass('risk-edge').style('opacity', 0.5);
                    });
                }
            });

            // Layout Select
            document.getElementById('layoutSelect').addEventListener('change', (e) => {
                cy.layout({ name: e.target.value, animate: true }).run();
            });

        } catch (e) {
            console.error("Graph Error:", e);
            document.getElementById('loading').innerHTML = `<span class="text-red-500">Error loading graph</span>`;
        }
    });
</script>
{% endblock %}
